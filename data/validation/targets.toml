# Validation-target registry. Each [[target]] is a number or outcome published in a primary
# paper, with the package call that reproduces it, a tolerance and a status. The test file
# test/validation_targets.jl runs every target that is not pending.
# Spec and human-readable table: lab/wiki/validation/targets.md
#
# status: reproduced | qualitative | discrepant | pending
# tolerance: { digits = n } | { atol = x } | { rtol = x } | { lower = a, upper = b } | {} (exact)
# regression (discrepant targets, or where the paper's number is approximate): our value and
#   its tolerance, so a change in the implementation is caught.
# Calls are evaluated in the Chytridiomycosis module; use Random.Xoshiro for seeded runs.
# Published values used inside calls come from the compendium, never literals.

# --- Schmidt et al. 2017, R Soc Open Sci 4:160801 (wiki R1–R3) ---------------------------

