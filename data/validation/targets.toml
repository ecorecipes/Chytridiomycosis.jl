# --- Drawert et al. 2017, J R Soc Interface 14:20170480 (wiki bd-drawert2017-stochastic-ibm) --
# Stochastic individual-based Briggs model with one-time interventions. Calls that read
# data/drawert2017/reproduction.toml use the stored output of scripts/drawert2017_*.jl (about
# 6 CPU-hours: a stratified sample of 116 of the 2132 points with 30 runs each, a small
# Nu/Sigma study and an intervention study; seeds in the scripts). The bundled
# baseline_points.csv is the authors' own table of points and 30-run results.

[[target]]
id = "drawert2017_lambda_range"
