# --- multistate survival ---------------------------------------------------------------------------
# Hollanders et al. 2023, Ecol Appl 33:e2724, and Palomar et al. 2023, Biodivers Conserv 32:793.
# Hollanders data are bundled (Dryad, CC0; data/hollanders2023).
# The targets that read the authors' posterior draws (repository mhollanders/mfleayi-adults, no
# licence, not bundled) are skipped when hollanders2023_draws_path() finds nothing. The refit
# targets use the reduced maximum-likelihood refit (CTMultistateProblem), computed once per
# session; their tolerances were set before the fit to one posterior sd of the published value,
# (HDI upper − lower)/3.92. Palomar et al. deposited no data: their estimates are pending, and
# the two discrepant targets compare printed numbers with each other.

