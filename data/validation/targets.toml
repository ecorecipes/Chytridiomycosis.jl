model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "invasion threshold K_threshold (adult females ha⁻¹)"
published = 1.0086
call = "invasion_threshold(SchmidtParameters(:schmidt2017))"
tolerance = { digits = 4 }
status = "reproduced"
notes = "Wiki target R1."

[[target]]
id = "schmidt2017_removal"
model = "bsal-schmidt2017-sli"
