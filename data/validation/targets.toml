model = "obs-load-distribution"
source = { ref = "schrock2024", location = "Results 3a (Proc R Soc B 2025)" }
quantity = "Taylor's power law slope, enzootic Sierra Nevada populations (and its contrast with post-invasion)"
published = 2.08
call = 'schrock_taylor_slopes(load_schrock2024(); by = :phase)[Symbol("enzootic\n(Northern Sierra)")].slope'
tolerance = { digits = 2 }
status = "discrepant"
regression = { value = 1.981, atol = 0.001 }
notes = """
Paper: enzootic 2.08 (2.00-2.16), "statistically steeper" than post-invasion epizootic 1.92
(1.86-1.99). The same OLS as the dataset slopes, on the Sierra groups labelled with each phase
in the deposit, gives enzootic 1.981 (1.897-2.065), post-invasion 1.930 (1.862-1.998) and
invasion 1.976 (1.887-2.064): post-invasion agrees, enzootic does not, and the two intervals
overlap, so the claimed difference is not reproduced. Every phase-labelled group is Rana
muscosa/sierrae ("ramu"), so restricting to the MYL frogs the Methods describe changes nothing.
The authors' phase script is not in the Zenodo code deposit (scripts 01, 03, 04, 05, 10, 11),
so the method behind 2.08 is unknown; nothing was tuned."""

[[target]]
id = "schrock2024_lognormal_slope_two"
model = "obs-load-distribution"
source = { ref = "schrock2024", location = "Methods 2b; Discussion" }
quantity = "Taylor's power law slope across groups with lognormal loads of equal log-scale spread"
published = 2.0
call = "_lognormal_taylor_slope()"
tolerance = { atol = 1e-9 }
status = "reproduced"
notes = """
"Given a lognormal distribution, we would expect a TPL slope of 2." Exact moments of 25
lognormal groups (sd 2 on the natural-log scale, means spanning 12 natural-log units), every
swab infected. With the zeros included, as the paper computes them, groups whose prevalence
differs break the identity: Var/mean^2 = (e^(sigma^2) - pi)/pi, so a slope below 2 (Sierra 1.90)
is what lognormal loads give when prevalence rises with mean load."""

