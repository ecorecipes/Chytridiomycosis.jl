authors' sd 0.49), so rainfall, which varies by survey, takes up survey-to-survey variation.
Plausible, not tested."""

[[target]]
id = "palomar2023_implied_prevalence"
model = "obs-multistate-survival"
source = { ref = "palomar2023", location = "Results (S, ψ means; 'overall prevalence of 27.79%')" }
quantity = "Bd prevalence among living males implied by the mean annual S_I, S_U, ψ_U→I, ψ_I→U (quasi-stationary), against the observed swab prevalence"
published = 0.2779
call = "palomar2023_implied_prevalence()"
tolerance = { atol = 0.15 }
status = "discrepant"
regression = { value = 0.7136, atol = 1e-4 }
notes = """
Our arithmetic from printed numbers only (tolerance set before computing). The survivors' long-run
state mix under the mean survival and transition probabilities is 71% infected (a two-state
chain without survival gives 0.583/(0.583 + 0.225) = 72%), against 27.8% of swabs positive (both
sexes; swabbing a random subsample). Hypothesis: the state-dependent δ (δ_U = 1 at the boundary,
δ_I = 0.119) attributes captures of unknown status to state I, inflating ψ_U→I. It fits
palomar2023_assignment_design too, but cannot be tested without the histories; the simulation
palomar2023_swabbing_experiment probes it: on one simulated data set (seed 2023) with survival
equal in both states, ψ_U→I = 0.2, ψ_I→U = 0.6, δ = 0.43 in both states and the four unswabbed
years, the published structure returned δ_U = 1.000, δ_I = 0.112, ψ_U→I = 0.66 and ψ_I→U = 0.25
(the published pattern, transitions reversed) but unbiased survival. A simulation, not the
data, so the target stays discrepant."""

