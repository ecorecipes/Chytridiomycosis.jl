tolerance = { rtol = 0.05 }
status = "discrepant"
regression = { value = 8.966, rtol = 0.001 }
notes = """
The paper reports ≈9%. Eq. (2.5) divided by the habitat area gives 8.97: fig. S3 plots the
ratio A/H labelled as a percentage. Read correctly, eq. (2.5) exceeds the whole habitat ninefold,
so its no-overlap assumption has failed; the explicit jump process (SchmidtColonyProblem) gives
about 93% of the habitat infected (wiki bsal-schmidt2017-sli)."""

