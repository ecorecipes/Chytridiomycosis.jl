[[target]]
id = "miller2025_alphabeta_identifiable"
model = "bd-miller2025-ctmc-refugia"
source = { ref = "miller2025", location = "§3.1; Supplement S2" }
quantity = "αβ is identifiable, α and β separately are not (posterior/prior SD ratios)"
published = true
call = """
let r = refugia_abc(load_miller2025(); nsamples = 10^5, seed = 1)
    pr = refugia_abc(load_miller2025(); nsamples = 10^4, acceptance = 1.0, seed = 2).accepted
    A = r.accepted
    sd(v) = sqrt(sum(abs2, v .- sum(v) / length(v)) / (length(v) - 1))
    sdr(v, w) = sd(v) / sd(w)
    sdr(A[:, 1] .* A[:, 3], pr[:, 1] .* pr[:, 3]) < 0.2 &&
        sdr(A[:, 1], pr[:, 1]) > 0.8 && sdr(A[:, 3], pr[:, 3]) > 0.5
end
"""
status = "qualitative"
notes = "SD ratios in the run with 10^6 draws: αβ_sh 0.08, α 0.64, β_sh 0.98."

