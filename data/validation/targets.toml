[[target]]
id = "briggs2010_fig2_clearance"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 2C" }
quantity = "below N*, every frog clears infection (10 frogs, 3 years)"
published = true
call = """
let p = BriggsParameters(:briggs2010)
    r = solve(BriggsLoadProblem(p; N = 10, S0 = fill(10.0, 10), tspan = (0.0, 1095.0));
              abstol = 1e-8, reltol = 1e-8)
    all(r.alive) && maximum(r.sol.u[end][1:10]) < 1e-6
end
"""
status = "qualitative"

[[target]]
id = "briggs2010_fig2_dieoff"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 2C" }
quantity = "above N*, every frog reaches Smax and dies, sooner at higher density"
published = true
call = """
let p = BriggsParameters(:briggs2010)
    run(N) = solve(BriggsLoadProblem(p; N = N, S0 = fill(10.0, N), tspan = (0.0, 1095.0));
                   abstol = 1e-8, reltol = 1e-8)
    r30, r60 = run(30), run(60)
    !any(r30.alive) && !any(r60.alive) && maximum(r30.death_time) > maximum(r60.death_time)
end
"""
status = "qualitative"

