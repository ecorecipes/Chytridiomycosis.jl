let d = load_louca2014()
    all(("suffer_noreservoir", "tolerate_noreservoir")) do k
        re = d[k]["risk_effects"]
        top = first.(sort([s => abs(v) for (s, v) in re if s != "Qo"]; by = x -> -x[2])[1:2])
        Set(top) == Set(["βA", "μZ"]) && abs(re["Qo"]) > maximum(abs(v) for (s, v) in re if s != "Qo")
    end
end
"""
status = "qualitative"
notes = "Suffer: μ_Z −0.56, β_A 0.54, then β_T 0.41; tolerate: β_A 0.54, μ_Z −0.50, β_T 0.31."

[[target]]
id = "louca2014_fig5_Qo_outcomes"
model = "bd-louca2014-load-distribution"
source = { ref = "louca2014", location = "§3c; Fig. 5c,d" }
quantity = "with Z_o = 0: clearance above 0.85 for Q_o < 10⁻², persistence peaks at Q_o ≈ 1 (bin 1–10), and extinction rises from 0 below Q_o = 0.1 to above 0.5 for Q_o of 10–1000"
published = true
call = """
let d = load_louca2014()
    all(("suffer_noreservoir", "tolerate_noreservoir")) do k
        b = d[k]["Qo_bins"]
        e = b["log10_edges"]; n = b["n"]
        c = [(e[j] + e[j+1]) / 2 for j in 1:length(n)]
        lo = [j for j in eachindex(n) if n[j] >= 5 && c[j] < -2]
        mid = [j for j in eachindex(n) if n[j] >= 20]
        hi = [j for j in eachindex(n) if n[j] >= 5 && 1 < c[j] < 3]
        all(b["clearance"][j] > 0.85 for j in lo) &&
            all(b["extinction"][j] == 0 for j in eachindex(n) if n[j] > 0 && c[j] < -1) &&
            c[argmax([n[j] >= 20 ? b["persistence"][j] : -1.0 for j in eachindex(n)])] == 0.5 &&
            all(b["extinction"][j] > 0.5 for j in hi)
    end
end
"""
status = "qualitative"
notes = """
Suffer: persistence 0.67 at Q_o in [1, 10), clearance 0.89–1 below 10⁻², extinction 0.51, 0.65,
0.86 in the three bins from 10 to 10⁴. The paper's extinction reaches 1 near Q_o = 10⁴; we have
too few runs there (2 and 1) to say."""

[[target]]
id = "louca2014_fig4_grid"
model = "bd-louca2014-load-distribution"
source = { ref = "louca2014", location = "§3c; Fig. 4c" }
quantity = "with Z_o = 0 and suffering tadpoles, extinction is most likely at high β_A and low μ_Z and clearance at low β_A and high μ_Z"
published = true
call = """
let g = load_louca2014()["suffer_noreservoir"]["fig4_grid"]
    E = reduce(hcat, g["extinction"])'; Cl = reduce(hcat, g["clearance"])'
    ie = argmax(E); ic = argmax(Cl)
    ie[1] == size(E, 1) && ie[2] == 1 && ic[1] <= size(Cl, 1) ÷ 2 && ic[2] == size(Cl, 2)
end
"""
status = "qualitative"
notes = "Rows: log10 β_A bins −10 … −3; columns: log10 μ_Z bins −3 … 0. Extinction 0.84 in the corner (β_A > 10⁻⁴, μ_Z < 10⁻²); clearance 0.91 at β_A ~ 10⁻⁹, μ_Z > 0.1."

