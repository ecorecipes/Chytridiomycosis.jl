model = "bsal-bozzuto2019-seasonal"
source = { ref = "bozzuto2019", location = "Results p. 4" }
quantity = "non-seasonal R0, aestivating population"
published = 2.13
call = "basic_reproduction_number(BozzutoParameters(:bozzuto2019; population = :aestivation))"
tolerance = { digits = 2 }
status = "discrepant"
regression = { value = 2.0948, atol = 1e-4 }
notes = """
0.3647 × 250/(43.40 + 0.125) = 2.095. The paper's Floquet-R0 values (1.92, numerical 1.92,
high activity 1.80) and target proportions (≈52%, 47%) all imply R0 ≈ 2.127; all of them
round correctly only for R0 in 2.125–2.129. Only c0, k0, d and δ0 enter R0 (c1, c2, ℓc, t1
and t2 do not). Single changes tested:
- k0 = 253.8 is ruled out. The numerical Floquet-R0 uses S(t) from v = 184, so it would
  stay at 1.89.
- d would have to be negative.
- c0 = 0.3703 and δ0 = 42.74 both reproduce every number, but the shape of the R0(t) curve
  of Fig. 2b separates them (digitised in data/bozzuto2019; test/bozzuto2019.jl).
  - A winter infective period of 28.7 days, with the 5-day summer period kept (δ0 = 42.74,
    δ1 = 0.703), matches the curve: RMS 0.022, about 2 px.
  - A larger c0 does not: RMS 0.116, 0.21–0.28 too low in winter.
  - Fitting both infective periods to the curve gives 28.7 and 4.95 days. The same fit on
    Fig. 2a returns 39.8 and 4.95 days, against the true 40 and 5.
So the aestivation figures used a longer winter infective period than the 26 days of
Appendix A1 (1/δ = 40 + 4b, b = -3.5). No documented calculation gives 28.7 days. It would
need 3.2 °C in that formula instead of 4; the stated 9.6 - 5 = 4.6 °C gives 23.9 days, and a
365-day year gives R0 = 2.089. So the value is fitted and the target stays discrepant.
Also ruled out:
- c0 = 0.7295/2 (2.095);
- the 1.1643 contact ratio recomputed for the aestivation cycle (about 1.17 by the closest
  reading of Appendix A1), which lowers c0 instead of raising it."""

