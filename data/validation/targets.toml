source = { ref = "drawert2017", location = "ESM §1.4" }
quantity = "every sampled point has a linearised growth rate λ in 0.035–0.35 day⁻¹ (our λ)"
published = true
call = """
let q = parameter_set(:drawert2017)
    all(r -> q.λ_min <= load_growth_rate(DrawertParameters(:drawert2017; point = r.id)) <= q.λ_max,
        load_drawert2017())
end
"""
status = "reproduced"
notes = "Our λ also equals the authors' λ column to the 6 figures printed (max difference 1.0e-6)."

[[target]]
id = "drawert2017_point_spacing"
model = "bd-drawert2017-stochastic-ibm"
source = { ref = "drawert2017", location = "ESM §1.4, eq. (10)" }
quantity = "smallest distance between two of the 2132 points, eq. (10) with the range of log c2, log c3"
published = 0.09
call = """
let cs = [nondimensional_parameters(DrawertParameters(:drawert2017; point = r.id))
          for r in load_drawert2017()]
    rg = nondimensional_ranges(cs)
    minimum(minimum(nondimensional_distance(cs[i], cs[j], rg) for j in eachindex(cs) if j != i)
            for i in eachindex(cs))
end
"""
tolerance = { lower = 0.09, upper = 0.0905 }
status = "qualitative"
regression = { value = 0.09010, atol = 0.00001 }
notes = """
ε = 0.09 is a minimum spacing, so the greedy rejection leaves nearest neighbours just above it
(0.0901; median 0.0935). Eq. (10) prints log(c_range); that metric gives 0.0919 (median 0.130),
which does not fit a rejection threshold of 0.09. The printed form is probably a typo."""

