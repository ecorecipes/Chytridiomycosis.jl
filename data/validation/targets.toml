[[target]]
id = "kelly2024_Topt_Eifel2019"
model = "thermal-performance"
source = { ref = "kelly2024", location = "Results; S1 Text Table E" }
quantity = "optimal growth temperature of Bsal isolate Eifel2019 (°C)"
published = 6.0
call = "thermal_optimum(IsolateTPC(:kelly2024, \"Eifel2019\").curve; range = (0.0, 30.0))"
tolerance = { atol = 0.5 }
status = "reproduced"
notes = "The optimum of the Table E polynomial is 6.06 °C."

[[target]]
id = "kelly2024_Topt_Luik2017"
model = "thermal-performance"
source = { ref = "kelly2024", location = "Results; S1 Text Table E" }
quantity = "optimal growth temperature of Bsal isolate Luik2017 (°C)"
published = 24.0
call = "thermal_optimum(IsolateTPC(:kelly2024, \"Luik2017\").curve; range = (0.0, 30.0))"
tolerance = { atol = 0.5 }
status = "discrepant"
regression = { value = 25.17, atol = 0.01 }
notes = """
The Table E quartic peaks at 25.17 °C on 0–30 °C, not at 24 °C. It has a second, lower local
maximum near 4 °C. The paper reports R² = 0.17 for this fit, so the optimum is poorly
determined either way."""

