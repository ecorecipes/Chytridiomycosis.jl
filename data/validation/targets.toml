notes = """
Wiki target R2. Eq. (2.3) with the Table 1 values gives 1.0030, and the residual of the ODE
right-hand side there is below 1e-10. Rounding of e, d_I or β does not explain the difference.
The supplement offers no explanation."""

[[target]]
