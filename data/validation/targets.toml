# Validation-target registry. Each [[target]] is a number or outcome published in a primary
# paper, with the package call that reproduces it, a tolerance and a status. The test file
# test/validation_targets.jl runs every target that is not pending.
# Spec and human-readable table: lab/wiki/validation/targets.md
#
# status: reproduced | qualitative | discrepant | pending
# tolerance: { digits = n } | { atol = x } | { rtol = x } | { lower = a, upper = b } | {} (exact)
# regression (discrepant targets, or where the paper's number is approximate): our value and
#   its tolerance, so a change in the implementation is caught.
# Calls are evaluated in the Chytridiomycosis module; use Random.Xoshiro for seeded runs.
# Published values used inside calls come from the compendium, never literals.

# --- Schmidt et al. 2017, R Soc Open Sci 4:160801 (wiki R1–R3) ---------------------------

[[target]]
id = "schmidt2017_K_threshold"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "invasion threshold K_threshold (adult females ha⁻¹)"
published = 1.0086
call = "invasion_threshold(SchmidtParameters(:schmidt2017))"
tolerance = { digits = 4 }
status = "reproduced"
notes = "Wiki target R1."

[[target]]
id = "schmidt2017_removal"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "fraction of hosts to remove to stop invasion (%)"
published = 96.0
call = "100 * removal_fraction(SchmidtParameters(:schmidt2017))"
tolerance = { digits = 0 }
status = "reproduced"
notes = "Wiki target R2."

[[target]]
id = "schmidt2017_crash_time"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "time to the population minimum after introduction (yr)"
published = "two to three months"
call = "population_crash(SchmidtParameters(:schmidt2017)).tmin"
tolerance = { lower = 0.0833333, upper = 0.3333334 }
status = "qualitative"
notes = "Wiki target R2. Accepted between one and four months."

[[target]]
id = "schmidt2017_crash_depth"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "population minimum as a fraction of K"
published = "almost zero"
call = """
let p = SchmidtParameters(:schmidt2017)
    population_crash(p).Smin / p.K
end
"""
tolerance = { lower = -1.0, upper = 0.05 }
status = "qualitative"
notes = "Wiki target R2. Accepted below 5% of K."

[[target]]
id = "schmidt2017_S_eq"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results, eq. (2.3)" }
quantity = "endemic equilibrium S_eq (adult females ha⁻¹)"
published = 1.0027
call = "endemic_equilibrium(SchmidtParameters(:schmidt2017)).S"
tolerance = { digits = 4 }
status = "discrepant"
regression = { value = 1.0030, digits = 4 }
notes = """
Wiki target R2. Eq. (2.3) with the Table 1 values gives 1.0030, and the residual of the ODE
right-hand side there is below 1e-10. Rounding of e, d_I or β does not explain the difference.
The supplement offers no explanation."""

[[target]]
id = "schmidt2017_hopf"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "carrying capacity K_H at the Hopf bifurcation (adult females ha⁻¹)"
published = 9.5
call = "hopf_threshold(SchmidtParameters(:schmidt2017))"
tolerance = { atol = 0.1 }
status = "discrepant"
regression = { value = 10.21, atol = 0.01 }
notes = """
Wiki target R2. The Jacobian at the verified equilibrium gives 10.21, and simulation confirms
it. Stability changes between K = 10.0 and 10.5."""

[[target]]
id = "schmidt2017_wave_speed"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "travelling-wave speed c (km yr⁻¹)"
published = 11.15
call = "wave_speed(SchmidtParameters(:schmidt2017))"
tolerance = { digits = 2 }
status = "reproduced"
notes = "Wiki target R3 (D = 0.0625 km² yr⁻¹)."

[[target]]
id = "schmidt2017_colony_area_1yr"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "ESM fig. S1e" }
quantity = "scattered-colony area A(1) after one year, eq. (2.5) (km²)"
published = 560.0
call = "scattered_colony_area(SchmidtParameters(:schmidt2017), 1.0)"
tolerance = { rtol = 0.01 }
status = "reproduced"
notes = "Read off fig. S1e (≈560). Confirms that eq. (2.5) is in km²."

[[target]]
id = "schmidt2017_habitat_share_mu1"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results; ESM fig. S3" }
quantity = "share of the German habitat infected after 8 years by scattered colonies, μ = 1 yr⁻¹"
published = 0.09
call = "scattered_colony_area(SchmidtParameters(:schmidt2017), 8.0) / parameter_set(:schmidt2017).habitat_area"
tolerance = { rtol = 0.05 }
status = "discrepant"
regression = { value = 8.966, rtol = 0.001 }
notes = """
The paper reports ≈9%. Eq. (2.5) divided by the habitat area gives 8.97: fig. S3 plots the
ratio A/H labelled as a percentage. Read correctly, eq. (2.5) exceeds the whole habitat ninefold,
so its no-overlap assumption has failed; the explicit jump process (SchmidtColonyProblem) gives
about 93% of the habitat infected (wiki bsal-schmidt2017-sli)."""

[[target]]
id = "schmidt2017_habitat_share_mu01"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results; ESM fig. S3" }
quantity = "share of the German habitat infected after 8 years by scattered colonies, μ = 0.1 yr⁻¹"
published = 0.001
call = "scattered_colony_area(SchmidtParameters(:schmidt2017), 8.0; μ = parameter_set(:schmidt2017; set = \"figS3_low\").μ) / parameter_set(:schmidt2017).habitat_area"
tolerance = { rtol = 0.05 }
status = "discrepant"
regression = { value = 0.1284, rtol = 0.001 }
notes = "The paper reports ≈0.1%; eq. (2.5) gives the ratio 0.128 (12.8%), as for μ = 1."

# --- Briggs, Knapp & Vredenburg 2010, PNAS 107:9695 (wiki R4) -----------------------------

[[target]]
id = "briggs2010_density_threshold"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 2C legend" }
quantity = "host density threshold N* (frogs per pool)"
published = 20.0
call = "host_density_threshold(BriggsParameters(:briggs2010))"
tolerance = { atol = 5.0 }
status = "reproduced"
regression = { value = 23.15, digits = 2 }
notes = """
Wiki target R4. The legend says "a density of ∼20 frogs". The Fig. 2C values give
N* = 23.15, which is the regression value."""

[[target]]
id = "briggs2010_fig2_clearance"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 2C" }
quantity = "below N*, every frog clears infection (10 frogs, 3 years)"
published = true
call = """
let p = BriggsParameters(:briggs2010)
    r = solve(BriggsLoadProblem(p; N = 10, S0 = fill(10.0, 10), tspan = (0.0, 1095.0));
              abstol = 1e-8, reltol = 1e-8)
    all(r.alive) && maximum(r.sol.u[end][1:10]) < 1e-6
end
"""
status = "qualitative"

[[target]]
id = "briggs2010_fig2_dieoff"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 2C" }
quantity = "above N*, every frog reaches Smax and dies, sooner at higher density"
published = true
call = """
let p = BriggsParameters(:briggs2010)
    run(N) = solve(BriggsLoadProblem(p; N = N, S0 = fill(10.0, N), tspan = (0.0, 1095.0));
                   abstol = 1e-8, reltol = 1e-8)
    r30, r60 = run(30), run(60)
    !any(r30.alive) && !any(r60.alive) && maximum(r30.death_time) > maximum(r60.death_time)
end
"""
status = "qualitative"

[[target]]
id = "briggs2010_fig3a_band"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 3A (starred point)" }
quantity = "persistence probability at the starred point without a reservoir"
published = "persistence in a narrow band only"
call = """
persistence_probability(BriggsSeasonalProblem(BriggsSeasonalParameters(:briggs2010; set = "fig3b"));
                        nruns = 40, rng = Random.Xoshiro(7))
"""
tolerance = { lower = 0.3, upper = 0.95 }
status = "qualitative"
notes = "Δt and the Poisson cut-off are our choices; the paper gives maps, not numbers."

[[target]]
id = "briggs2010_fig3d_reservoir"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 3D" }
quantity = "with an external zoospore source, Bd persists with no adult deaths"
published = true
call = """
let r = solve(BriggsSeasonalProblem(BriggsSeasonalParameters(:briggs2010; set = "fig3d"));
              rng = Random.Xoshiro(1))
    r.persisted && sum(r.deaths) == 0
end
"""
status = "qualitative"

[[target]]
id = "briggs2010_fig3f_tadpoles"
model = "bd-briggs2010-load"
source = { ref = "briggs2010", location = "Fig. 3F" }
quantity = "with long-lived tadpoles, Bd persists with no adult deaths"
published = true
call = """
let r = solve(BriggsSeasonalProblem(BriggsSeasonalParameters(:briggs2010; set = "fig3f"));
              rng = Random.Xoshiro(1))
    r.persisted && sum(r.deaths) == 0
end
"""
status = "qualitative"

