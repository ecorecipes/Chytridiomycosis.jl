[[target]]
id = "louca2014_Qo_invasion"
model = "bd-louca2014-load-distribution"
source = { ref = "louca2014", location = "§3a, eq. (3.1); ESM §2.3, eqs (18)–(19)" }
quantity = "Q_o > 1 is the invasion condition: sign of the spectral bound of J̄_o equals sign(Q_o − 1) over 2000 sampled parameter sets with finite Q_o"
published = true
call = """
let rng = Random.Xoshiro(2783), ok = true, n = 0
    for _ in 1:2000
        s = louca_sample(rng; tadpoles = :suffer, reservoir = false)
        Q = reproduction_quotient(s.p)
        isfinite(Q) || continue
        n += 1
        ok &= sign(louca_growth_rate(s.p)) == sign(Q - 1)
    end
    ok && n > 300
end
"""
status = "qualitative"
notes = "Q_o is finite (λ_s < R̄_s for both stages) in about a quarter of the draws, since λ_s spans −1 to 1 d⁻¹ and R̄_s is mostly well below 1 d⁻¹."

