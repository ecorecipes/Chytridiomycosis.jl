[[target]]
id = "schmidt2017_S_eq"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results, eq. (2.3)" }
quantity = "endemic equilibrium S_eq (adult females ha⁻¹)"
published = 1.0027
call = "endemic_equilibrium(SchmidtParameters(:schmidt2017)).S"
tolerance = { digits = 4 }
status = "discrepant"
regression = { value = 1.0030, digits = 4 }
notes = """
Wiki target R2. Eq. (2.3) with the Table 1 values gives 1.0030, and the residual of the ODE
right-hand side there is below 1e-10. Rounding of e, d_I or β does not explain the difference.
The supplement offers no explanation. Probable cause, without tuning: the published value is
(d + e)(d + d_I)/(βe) = 1.002748, which rounds to 1.0027. That is the equilibrium S with the
density-dependent losses γN of the L and I classes dropped, and the K → ∞ limit of eq. (2.3)
(S_eq is 1.00287 at K = 50 and 1.00275 at K = 1000). It is the natural approximation when
γN* = 0.011 yr⁻¹ is small against e and d_I. But the paper prints the exact eq. (2.3), so
the target stays discrepant. Ruled out: rounding I_eq in the printed form
S = K - L - I - βKI/(b - d) (S would need I_eq = 0.00489061, not 0.00489056), and the
365-day rates β = d_I = 365/7, e = 365 (1.0030)."""

[[target]]
id = "schmidt2017_hopf"
model = "bsal-schmidt2017-sli"
source = { ref = "schmidt2017", location = "Results" }
quantity = "carrying capacity K_H at the Hopf bifurcation (adult females ha⁻¹)"
published = 9.5
call = "hopf_threshold(SchmidtParameters(:schmidt2017))"
tolerance = { atol = 0.1 }
status = "discrepant"
regression = { value = 10.21, atol = 0.01 }
notes = """
Wiki target R2. The Jacobian at the verified equilibrium gives 10.21, and simulation confirms
it. Stability changes between K = 10.0 and 10.5. Ruled out: 365-day or rounded rates
(e = 365: 10.23; β = 365/7: 10.19; d_I = 365/7: 10.22; all three: 10.21); density
dependence on S only, or on
recruitment (10.16); the Jacobian at the approximate S_eq = 1.0027 of schmidt2017_S_eq
(19.4) or at S_eq rounded to 1.0030 (10.42). K_H = 9.5 would need e ≈ 326 yr⁻¹. Time units
cannot matter (K_H is a density). The complex pair is almost neutral over the whole range:
Re λ = -0.0011 yr⁻¹ at K = 9.5 (e-folding time ≈ 900 yr; period 1.9 yr) and -0.004 yr⁻¹ at
K = 8. A threshold read from simulations, or with a coarse step in K, could not separate 9.5
from 10.2, but nothing in the paper says how K_H was found. Unexplained."""

