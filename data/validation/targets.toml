tolerance = { lower = 3.5, upper = 4.5 }
status = "discrepant"
regression = { value = 2.807, atol = 0.001 }
notes = """
The paper names the Nevada sites as the previous observations: 3,159,289/4,924 = 642 (2.81
orders) and 3,159,289/2,109 = 1,498 (3.18). Against the Oregon mean (100 per L) it is 4.50
orders, against the 41-site mean (40) 4.90 and against the median (15) 5.32; none of these is
"any previous observation". The review's "five orders of magnitude in force of infection" is
the ratio to the mean, which the paper does not state. "Nearly three orders" (the
ratio to 4,924) is right."""

