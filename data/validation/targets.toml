notes = """
If the toads swabbed were a random subsample, the probability that a capture's status is
recorded cannot depend on the toad's state, and should be near 588/1369 = 0.43 (lower still if
2006–2007 and 2017–2018, unswabbed, are included). The published δ_U = 1.000 (no SE) and
δ_I = 0.119 are not consistent with that. Same hypothesis as palomar2023_implied_prevalence."""

