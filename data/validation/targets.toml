call = "shed_viability()"
tolerance = { lower = 0.75, upper = 0.85 }
status = "qualitative"
notes = """
logistic(1.29) = 0.784 at day 0 for the reference species. The odds rise by exp(0.05) = 1.051
per day (the text says 1.06, which needs an unrounded slope of at least 0.0535), so for A.
zeteki the regression gives 0.90 by day 18, when the last one died; for H. lemur (slope 0.01)
0.86 by day 35. "Approximately 80% throughout" describes the intercept better than the end of
the experiment."""

