# --- Miller et al. 2025, arXiv:2503.06846 v3 (refugia CTMC; wiki bd-miller2025-ctmc-refugia) --
# The posterior targets run an ABC with 10^5 draws (0.2% accepted) and seed 1. This takes a
# few seconds on one thread. Each tolerance is about 3 sd of its Monte Carlo spread over 20
# seeds (scripts/miller2025_abc.jl, data/miller2025/abc_reproduction.toml).
# The paper's run used 10^6 draws. Twenty such runs give (mean ± sd over seeds):
# β_sh 0.694 ± 0.013, β_un 0.414 ± 0.009, α 0.069 ± 0.002, ω 0.565 ± 0.010, and a refugia
# effect of 0.404 ± 0.014.

