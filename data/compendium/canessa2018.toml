# --- Transmission, eqs. S3, S5 (Table S1) ---------------------------------------------------

[[parameter]]
symbol = "β0"
quantity = "encounter rate scaling the load-dependent transmission function β(z)"
value = 0.007
units = "ha per 3-day step"
provenance = "D"
role = "uncertain"
system = { pathogen = "Bsal", host = "Salamandra salamandra", stage = "adult", setting = "Robertville, Belgium" }
location = "Table S1; SI pp. 3-4, lines 60-88 (median; 95% CI 0.0037-0.0125)"
verified = true
notes = """
Derived per draw from the final-size relation eq. S6 with S0 and s̄ from Stegen et al. (2017).
The archived beta0 column reproduces the median and CI (0.00699; 0.00372-0.01245). Eq. S6
with S0 = 503 per ha, S∞ = 7 and s̄ = 0.542 gives 0.0039, not 0.007; with S0 as the count on
the 0.475-ha transect (503 × 0.475 = 238.9 adults) it gives 0.00697. The archived pairs say
the same: with N0 = S0 × 0.475 (an integer in every row) and S∞ = 7, the implied
s̄ = 1 - beta0 (N0 - S∞)/ln(N0/S∞) lies in 0.17-0.83 for all 1,000 draws, mean 0.544 (printed
0.542), whereas with S0 per ha 13% of draws would need s̄ < 0. So β0 is per adult on the
transect, not per ha (inferred, not printed; validation targets canessa2018_beta0_final_size
and canessa2018_beta0_draws_sbar). The value is kept as archived; the units label stays as
printed. Bozzuto & Canessa (2019) use 0.007 × 364/3 = 0.8493 ha yr^-1 (their c0 × 1.1643)."""

