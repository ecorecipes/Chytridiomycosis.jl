# Canessa S, Bozzuto C, Campbell Grant EH, Cruickshank SS, Fisher MC, Koella JC, Lötters S,
# Martel A, Pasmans F, Scheele BC, Spitzen-van der Sluijs A, Steinfartz S, Schmidt BR (2018)
# Decision-making for mitigating wildlife diseases: from theory to practice for an emerging
# fungal pathogen of amphibians. J Appl Ecol 55:1987-1996.
# https://doi.org/10.1111/1365-2664.13089
#
# Read on 2026-11-13 from lab/papers/canessa2018.pdf, which is the *confidential review copy*
# (ScholarOne, 28 Sep 2017; main text, Table 1, Figs 1-4 and the Online Supporting Information
# with eqs S1-S12 and Table S1). It carries no DOI; the DOI above resolves (Crossref) to the same
# title and the same 13 authors, J Appl Ecol 55(4):1987-1996. The version of record and its
# Wiley supplements were not accessible (HTTP 403), so the published wording may differ.
# The archived parameter draws (Dryad doi:10.5061/dryad.0jh5p, file
# Canessa_JAPPL_2017_00978_SI2.xls, CC0; identical MD5 to lab/papers/canessa2018_si4.xls) are
# bundled as data/canessa2018/parameter_draws.csv.
#
# System: fire salamander (Salamandra salamandra) adults and Bsal, a closed population over a
# post-reproductive period. Discrete time, one step = 3 days, 30 steps (three months).
# Densities: adults per hectare. Loads: Bsal genomic equivalents (GE, qPCR); the model works on
# z = ln(load), with load 0 placed at z = -1 (SI lines 44-46). The basis of GE (per swab or per
# host) is not stated.
#
# Sets: the base set holds Table S1 (the experts' best estimates and the derived values),
# the numerical settings and the Table 1 management actions. Table S1 itself is not what the
# ensemble simulations used: each of the 1,000 IPM runs refits the functions to one row of
# the archived draws (SI p. 3, line 87; Table S1 caption "for the full distribution of each
# parameter value see archived data").
#
# Rates and probabilities are per 3-day step. β0 is printed as multiplying a density of
# infected adults (ha^-1), i.e. ha per step; Bozzuto & Canessa (2019) converted it to years
# with 364/3 steps per year. Eq. S6 and the archived draws show it was derived from the count
# on the 0.475-ha Stegen transect, i.e. per adult on the transect (see β0, S_inf, I0_count).

source = { ref = "canessa2018", doi = "10.1111/1365-2664.13089", review_ref = 30 }

