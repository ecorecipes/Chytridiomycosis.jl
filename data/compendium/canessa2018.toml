# --- Survival, eq. S4 (Table S1) --------------------------------------------------------------

[[parameter]]
symbol = "s0"
quantity = "3-day survival probability of susceptible adults"
value = 0.9906
units = "1"
provenance = "F"
role = "estimated"
system = { pathogen = "none", host = "Salamandra salamandra", stage = "adult" }
location = "Table S1 ('s(z) fit to elicited survival values; s0 = s(z=0)')"
verified = true
notes = """
Printed inconsistency: logistic(b0) with the printed b0 = 4.3712 is 0.9875, not 0.9906, and
s(z = -1) is 0.9946. SI line 53 calls s0 'very similar' to the survival implied by an 8-year
adult lifespan, but that is exp(-3/(8 × 365)) = 0.99897 per 3 days; 0.9906 per 3 days is an
annual survival of 0.32. The ensemble runs use s(0) of each draw's own fit (median 0.996)."""

[[parameter]]
