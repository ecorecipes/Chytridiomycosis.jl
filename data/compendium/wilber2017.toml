# Wilber MQ, Knapp RA, Toothman M, Briggs CJ (2017) Resistance, tolerance and environmental
# transmission dynamics determine host extinction risk in a load-dependent amphibian disease.
# Ecology Letters 20:1169–1181. https://doi.org/10.1111/ele.12814
#
# Read on 2026-11-14 from the published PDF (lab/papers/wilber2017.pdf: eqns 1–3, Tables 1–2,
# Methods, Results, Figs 1–3) and the authors' GitHub repository mqwilber/host_extinction
# (master branch archive, saved in lab/papers/wilber2017_si/code/host_extinction-master/):
# code/model_analysis/{model_parameters.yml, IPM_functions_for_R.R, R0_environmental.R,
# stochastic_multiseason_simulation.R, sensitivity_analysis.R, stable_stage_structure.R,
# zdecay_plots.R} and code/stat_analysis/{ipm_vital_rates_bayesian.R, pomp_transmission.R,
# stan_files/*.stan}. The repository also holds the March 2017 preprint and its appendix
# (docs/ipm_extinction_{manuscript,appendix}.pdf); the journal's Appendices S1–S4 returned
# HTTP 403. The mesocosm data are on Dryad (doi:10.5061/dryad.p614h, CC0) and bundled as
# data/wilber2017/.
#
# System: adult Rana muscosa/R. sierrae, three tadpole stages, Bd. One time step is 3 days.
# Loads: x is the NATURAL log of the qPCR load in zoospore equivalents per swab,
# x = ln(ZE swab^-1); uninfected is a separate class. T is temperature in °C. Probabilities are
# per 3-day step. The survival function is fitted on the z-scored load (x − x̄)/s_x, with x̄ and
# s_x of the 20 °C transitions; the paper does not print x̄ and s_x (records surv_mean,
# surv_sd below, derived from the bundled Wilber 2016 data).
#
# Sets:
# - base: Table 1 as printed, the simulation design (text and code) and the R0 grid.
# - "coded": full-precision values from the authors' code where Table 1 rounds them
#   (s0 = 0.9^(1/122), tadpole survivals).
# - "const", "const_dd", "const_fd", "zpool", "zpool_dd", "zpool_fd": the six transmission
#   functions of Table 2 (β0, β1, WAIC, weight). Λ is per day and multiplied by Δt.

source = { ref = "wilber2017", doi = "10.1111/ele.12814", review_ref = 34 }

