symbol = "adult_survival"
quantity = "annual survival of adult and sub-adult females, L. raniformis, post-Bd"
value = 0.319
units = "yr^-1"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Litoria raniformis", stage = "adult", setting = "remnant populations, northern Melbourne (contemporary)" }
location = "Run_STEPS_simulations.R, 'as estimated from age structure data'"
verified = false
notes = "Value entered in Run_STEPS_simulations.R and used in the simulations. The paper (Results 3.1) prints the posterior mean 0.318; see adult_survival_printed. Sub-adult survival is set equal (Methods 2.2: two stages with equal survival)."

