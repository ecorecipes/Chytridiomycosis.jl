# Heard GW, Scroggie MP, Hollanders M, Scheele BC (2024) Age truncation due to disease shrinks
# metapopulation viability for amphibians. J Anim Ecol 93:1670-1683.
# https://doi.org/10.1111/1365-2656.14177
# Data and code: Zenodo doi:10.5281/zenodo.10457229 (CC BY 4.0), retrieved 2026-11-19 into
# lab/papers/heard2024/zenodo/.
#
# VERSION CHECKED: the published version (lab/papers/heard2024/paper.pdf), read 2026-11-20.
# Records with verified = true were checked against its text and their `location` cites it.
# The rest (carrying capacities, dispersal proportions, the 1500 m truncation, the initial
# abundance) are given only in the Supplementary Material, which was not read, and come from
# the authors' R code (Zenodo archive), so they stay unverified. The paper prints posterior
# means of survival (Results 3.1) that differ from the values entered in the simulation
# script for the pre-Bd period (0.655 vs 0.641, 0.688 vs 0.673): both are recorded, as
# adult_survival (as coded) and adult_survival_printed (as printed).
#
# Species: Litoria aurea (green and golden bell frog; Southern Highlands / Canberra region,
# NSW and ACT) and Litoria raniformis (growling grass frog; northern Melbourne, Victoria).
# Time in years. Space: 25 x 25 grids of 65 m cells (sample_landscapes.grd), distances in m.
# Population counts are FEMALES (the model is female-only). Bd enters ONLY through the
# adult and sub-adult survival rates (historical = pre-Bd museum specimens, contemporary =
# post-Bd); there is no infection process.
#
# Sets: Lran_contemporary, Lran_historical, Laur_contemporary, Laur_historical.

source = { ref = "heard2024", doi = "10.1111/1365-2656.14177", review_ref = 37 }

[[parameter]]
symbol = "met_survival"
quantity = "survival of metamorphs to the sub-adult stage (folded into fecundity)"
value = 0.1
units = "1"
provenance = "A"
role = "structural"
location = "Methods 2.2 ('metamorph survival probability through to emergence from their first winter brumation (0.1)')"
verified = true
notes = "Checked against the published paper (2026-11-20); same as Run_STEPS_simulations.R."

[[parameter]]
symbol = "sex_ratio"
quantity = "proportion of metamorphs that are female"
value = 0.5
units = "1"
provenance = "A"
role = "structural"
location = "Methods 2.2 ('the proportion of metamorphs that are female (0.5)')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "subadult_breeding_fraction"
quantity = "fraction of sub-adult females that breed (multiplies sub-adult fecundity)"
value = 0.2
units = "1"
provenance = "A"
role = "structural"
location = "Methods 2.2 ('0.2 for females in their first breeding season')"
verified = true
notes = "Checked against the published paper (2026-11-20); the first-season stage is the paper's 'sub-adult' stage of the code (1 LAG)."

[[parameter]]
symbol = "initial_fraction"
quantity = "initial number of females per stage and patch, as a fraction of round(K/2)"
value = 0.5
units = "1"
provenance = "A"
role = "structural"
location = "STEPS_model.R, steps.func (ia.adults = round(K*0.5)*0.5)"
verified = false
notes = "From the authors' code; both sub-adults and adults start at round(K*0.5)*0.5."

[[parameter]]
symbol = "time_steps"
quantity = "simulation horizon"
value = 50
units = "yr"
provenance = "A"
role = "structural"
location = "Methods 2.2 ('a single simulation of metapopulation dynamics over 50 years')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "cell_size"
quantity = "width of a landscape cell (one cell = one potential habitat patch)"
value = 65
units = "m"
provenance = "M"
role = "structural"
location = "Methods 2.2 ('25 x 25, with the pixel size of 65 x 65 m')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "distance_decay"
quantity = "distance decay of the exponential dispersal kernel exp(-d/decay)"
value = 200
units = "m"
provenance = "A"
role = "structural"
location = "Methods 2.2 (dispersal kernel e^(-d/200))"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "max_distance"
quantity = "maximum dispersal distance (destinations strictly closer than this)"
value = 1500
units = "m"
provenance = "A"
role = "structural"
location = "STEPS_model.R, kernel_dispersal(max_distance = 1500)"
verified = false
notes = "From the authors' code. The paper (Methods 2.2) describes the kernel as giving dispersal 'up to a maximum of ~1 km'; the coded truncation is 1500 m. The Supplementary Material (not read) may give the value."

[[parameter]]
symbol = "mets_min"
quantity = "smallest fertility scenario: female-and-male metamorphs per adult female per year"
value = 3
units = "yr^-1"
provenance = "A"
role = "scenario"
location = "Methods 2.2 ('varied from 3-30 metamorphs ... at increments of 3')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "mets_max"
quantity = "largest fertility scenario (metamorphs per adult female per year)"
value = 30
units = "yr^-1"
provenance = "A"
role = "scenario"
location = "Methods 2.2 ('varied from 3-30 metamorphs ... at increments of 3')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "mets_step"
quantity = "step of the fertility scenario grid"
value = 3
units = "yr^-1"
provenance = "A"
role = "scenario"
location = "Methods 2.2 ('varied from 3-30 metamorphs ... at increments of 3')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "cv_min"
quantity = "smallest coefficient of variation scenario (fertility and mortality CVs)"
value = 0.1
units = "1"
provenance = "A"
role = "scenario"
location = "Methods 2.2 (CV of fertility and of mortality 10%-100% at increments of 10%)"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "cv_max"
quantity = "largest coefficient of variation scenario"
value = 1.0
units = "1"
provenance = "A"
role = "scenario"
location = "Methods 2.2 (CV of fertility and of mortality 10%-100% at increments of 10%)"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "cv_step"
quantity = "step of the coefficient of variation grids"
value = 0.1
units = "1"
provenance = "A"
role = "scenario"
location = "Methods 2.2 (CV of fertility and of mortality 10%-100% at increments of 10%)"
verified = true
notes = "Checked against the published paper (2026-11-20)."

[[parameter]]
symbol = "prior_precision"
quantity = "precision of the normal priors on the catch-curve intercept and effects"
value = 0.001
units = "1"
provenance = "A"
role = "structural"
location = "Methods 2.1 ('beta ~ dnorm(0, 0.001)')"
verified = true
notes = "Checked against the published paper (2026-11-20). NIMBLE dnorm takes a precision: prior SD = 31.6 on the logit scale."

[[parameter]]
symbol = "sigma_site_max"
quantity = "upper bound of the uniform prior on the SD of the site effects"
value = 10
units = "1"
provenance = "A"
role = "structural"
location = "Methods 2.1 ('sigma_site ~ dunif(0, 10)')"
verified = true
notes = "Checked against the published paper (2026-11-20)."

