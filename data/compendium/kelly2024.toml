# Kelly M, et al. (2024) High phenotypic diversity correlated with genomic variation across the
# European Batrachochytrium salamandrivorans epidemic. PLoS Pathog 20:e1012579.
# https://doi.org/10.1371/journal.ppat.1012579
# Growth-rate thermal performance curves of 13 Bsal isolates: the best-fitting polynomial
# (degree 1-4, chosen by ANOVA) of the GrowthCurver growth rate r against temperature x (degC),
# r = c0 + c1 x + c2 x^2 + c3 x^3 + c4 x^4. Coefficients transcribed from S1 Text, Table E
# (the supplementary .docx of the PLoS article), 2026-11-11. Fig. 2 gives r in "count.day-1".
# Tested temperatures (Results): 0, 4, 10, 15, 20, 25 and 30 degC. One named set per isolate.
# The paper reports weak fits for some isolates (R^2 = 0.35 for Eifel2019, 0.17 for Luik2017).

source = { ref = "kelly2024", doi = "10.1371/journal.ppat.1012579", review_ref = 23 }

[[parameter]]
symbol = "T_tested_min"
quantity = "lowest temperature of the growth experiments (lower end of the fitted range)"
value = 0.0
units = "degC"
provenance = "M"
role = "structural"
system = { pathogen = "Bsal", setting = "culture" }
location = "Results, 'Thermal tolerance differs between Bsal isolates'"
verified = true

[[parameter]]
symbol = "T_tested_max"
quantity = "highest temperature of the growth experiments (upper end of the fitted range)"
value = 30.0
units = "degC"
provenance = "M"
role = "structural"
system = { pathogen = "Bsal", setting = "culture" }
location = "Results, 'Thermal tolerance differs between Bsal isolates'"
verified = true

