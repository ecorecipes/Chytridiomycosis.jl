# Grear DA, Adams MJ, Backlin AR, et al. (2025) Pan-amphibia distribution of the fungal
# parasite Batrachochytrium dendrobatidis varies with species and temperature. Ecological
# Monographs 95:e70001. https://doi.org/10.1002/ecm.70001 (open access, CC BY-NC 4.0)
#
# Read on 2026-11-20 from the published full text (lab/papers/grear2025/grear2025.pdf):
# Abstract, Methods ("Model fitting and diagnostics", "Imputation for missing data"), Results
# and Figs 6–7. (An earlier version of this file was written from the abstract only.)
# System: post-metamorphic and larval amphibians, 54 species, 35 states of the conterminous
# US, May 2014 – Aug 2017, one qPCR swab per animal, intensity in estimated ITS copies per swab.
#
# Fixed effects are printed ONLY as 95% credible intervals (Results, "Individual,
# environmental, and species fixed effects"); no point estimates are printed. Each record
# below stores the printed interval in `uncertainty` and its midpoint as `value`
# (provenance D, derived by us). α are prevalence (logit π) coefficients, β log-intensity
# coefficients; temperature is the 30-day mean daily maximum (°C), precipitation the 10-day
# total (mm); age relative to adults, sex relative to females.

source = { ref = "grear2025", doi = "10.1002/ecm.70001", review_ref = 53 }

