# Louca S, Lampo M, Doebeli M (2014) Assessing host extinction risk following exposure to
# Batrachochytrium dendrobatidis. Proc R Soc B 281:20132783.
# https://doi.org/10.1098/rspb.2013.2783
# Checked against the published PDF (lab/papers/louca2014.pdf) and the electronic supplementary
# material (ESM), which the first author's site bundles after the article
# (lab/papers/louca2014_si/Louca2014Assessing_authorsite.pdf, pp. 9–22; the journal's ESM
# link returns HTTP 403). "§" is the main text; "ESM §" the supplement.
# Time unit: days. A year is Y = 365 days (the ESM writes Y for "the duration of one year").
# Degree of infection (DOI) = zoospores on a host; the ESM (§5.1) reads it as the qPCR load of
# a standardised swab, so loads are recorded as ZE swab^-1.
#
# The base set holds the defaults of ESM Table S1 (values used for Figs 2–3 unless the figure
# row says otherwise), the sampling ranges of Table 1 (symbols *_min, *_max), the numerical
# design of ESM §5 and the inputs of the parameter estimates of ESM §4. Named sets "fig2ab",
# "fig2cd", "fig3a" and "fig3b" are the rows of Table S1 for the main-text figures.

source = { ref = "louca2014", doi = "10.1098/rspb.2013.2783", review_ref = 37 }

# --- calendar and numerics ----------------------------------------------------------------

[[parameter]]
symbol = "Y"
quantity = "length of one year"
value = 365
units = "day"
provenance = "A"
role = "structural"
system = { pathogen = "Bd" }
location = "ESM §1.1 (Y is the duration of one year)"
verified = false
notes = "The number of days is not printed; 365 assumed."

[[parameter]]
symbol = "m"
quantity = "number of DOI bins between 0 and the lethal DOI F_s"
value = 100
units = "1"
provenance = "A"
role = "numerical"
system = { pathogen = "Bd" }
location = "ESM §5 (range 0 … F_s split into m = 100 bins; rates rescaled by m/F_s)"
verified = true

[[parameter]]
