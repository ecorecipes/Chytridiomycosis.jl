# Longo AV, Rodriguez D, da Silva Leite D, Toledo LF, Mendoza Almeralla C, Burrowes PA,
# Zamudio KR (2013) ITS1 copy number varies among Batrachochytrium dendrobatidis strains:
# implications for qPCR estimates of infection intensity from field-collected amphibian skin
# swabs. PLoS ONE 8:e59499. https://doi.org/10.1371/journal.pone.0059499
# Checked against the PDF, 2026-11-11. Eight Bd strains. Used by convert_load
# (ITS1CopiesPerSwab <-> ZEPerSwab) to bound copies_per_zoospore.

source = { ref = "longo2013", doi = "10.1371/journal.pone.0059499", review_ref = 12 }

[[parameter]]
symbol = "copies_per_zoospore_min"
quantity = "lowest ITS1 copy number per zoospore among the strains"
value = 10.0
units = "copies zoospore^-1"
provenance = "M"
role = "uncertain"
system = { pathogen = "Bd", setting = "culture" }
location = "Abstract; Results, Fig. 4A"
verified = true

[[parameter]]
symbol = "copies_per_zoospore_max"
quantity = "highest ITS1 copy number per zoospore among the strains"
value = 144.0
units = "copies zoospore^-1"
provenance = "M"
role = "uncertain"
system = { pathogen = "Bd", isolate = "CLFT023", setting = "culture" }
location = "Abstract; Results, Fig. 4A"
verified = true

# ---------------------------------------------------------------------------------------
# Added 2026-11-14 for the load observation layer (src/observation/load_units.jl), checked
# against the PDF: Methods (Standard Sets A-C), Table 1 and the bar labels of Fig. 4.
# Fig. 4 is a raster image whose bars carry printed value labels; those labels are
# transcribed, not digitised. pdftotext renders the minus signs of Table 1 as "2"
# (y = 23.13x + 31.6 is y = -3.13x + 31.6).

[[parameter]]
symbol = "amplicon_bp"
quantity = "length of the M13 PCR amplicon used as the absolute ITS1 standard (146 bp insert plus 254 bp vector)"
value = 400.0
units = "bp"
provenance = "M"
role = "structural"
system = { pathogen = "Bd", isolate = "JEL427", setting = "culture" }
location = "Methods, Bd strain comparison"
verified = true

[[parameter]]
symbol = "bp_mass"
quantity = "average mass of one base pair, as printed"
value = 660.0
units = "Da bp^-1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", setting = "culture" }
location = "Methods, Bd strain comparison"
verified = true
notes = "The printed amplicon mass (4.10e-10 ng) does not follow from 400 bp x 660 Da (4.38e-10 ng); it follows from the standard dsDNA formula (617.96 bp + 36.04) g/mol. See amplicon_mass and the validation target longo2013_amplicon_mass."

[[parameter]]
symbol = "amplicon_mass"
quantity = "mass of one copy of the ITS1/5.8S amplicon fragment"
value = 4.10e-10
units = "ng copy^-1"
provenance = "D"
role = "structural"
system = { pathogen = "Bd", setting = "culture" }
location = "Methods, Bd strain comparison"
verified = true

[[parameter]]
symbol = "genome_bp"
quantity = "diploid genome size used to convert DNA mass to zoospores"
value = 46.0e6
units = "bp"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", setting = "culture" }
location = "Methods, Standard Set B (citing ref. 16)"
verified = true

[[parameter]]
symbol = "standard_B_top"
quantity = "top concentration of the equimolar DNA standards (Standard Set B)"
value = 0.3
units = "ng uL^-1"
provenance = "M"
role = "structural"
system = { pathogen = "Bd", setting = "culture" }
location = "Methods, Standard Set B"
verified = true

[[parameter]]
symbol = "zoospores_in_standard_B_top"
quantity = "zoospores whose genomes make up the top Standard Set B concentration (printed as roughly 6,000 per uL)"
value = 6000.0
units = "zoospores uL^-1"
provenance = "D"
role = "structural"
system = { pathogen = "Bd", setting = "culture" }
location = "Methods, Standard Set B"
verified = true
notes = "Approximate (printed with ~). Derived in the paper from 0.3 ng uL^-1 and a 46 Mb diploid genome."

[[parameter]]
symbol = "copies_per_1_5ng_text_min"
quantity = "lowest ITS1 copy number in 1.5 ng of DNA, as stated in the text"
value = 6.0e5
units = "copies (1.5 ng DNA)^-1"
provenance = "M"
role = "uncertain"
system = { pathogen = "Bd", setting = "culture" }
location = "Results, ITS1/5.8S copy number"
verified = true

[[parameter]]
symbol = "copies_per_1_5ng_text_max"
quantity = "highest ITS1 copy number in 1.5 ng of DNA, as stated in the text"
value = 6.0e6
units = "copies (1.5 ng DNA)^-1"
provenance = "M"
role = "uncertain"
system = { pathogen = "Bd", setting = "culture" }
location = "Results, ITS1/5.8S copy number"
verified = true
notes = "Fig. 4B's highest bar (LBAbercrom) is labelled 6.4 x 10^6, not 6.0 x 10^6; see the validation target longo2013_copies_1_5ng_max."

