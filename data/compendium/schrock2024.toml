# Schrock SAR, Walsman JC, DeMarchi J, LeSage EH, Ohmer MEB, Rollins-Smith LA, Briggs CJ,
# Richards-Zawacki CL, Woodhams DC, Knapp RA, Smith TC, Haddad CFB, Becker CG, Johnson PTJ,
# Wilber MQ. Do fungi look like macroparasites? Quantifying the patterns and mechanisms of
# aggregation for host-fungal parasite relationships.
#   Preprint: bioRxiv 2024, doi:10.1101/2024.08.29.609018 (lab/papers/schrock2024.pdf).
#   Published: Proc R Soc B 292:20242013 (2025), doi:10.1098/rspb.2024.2013, CC BY 4.0
#   (lab/papers/schrock2025_published/).
#   Data: Dryad doi:10.5061/dryad.mgqnk998g (CC0; group summaries only, raw swabs not
#   deposited). Code: Zenodo doi:10.5281/zenodo.14291806 (MIT), read for 03_Fig.1_TPL_Plot.R
#   and 01_Aggregation_Groups.R.
# Checked against both PDFs, 2026-11-14. Values are the published version's; where the
# preprint differs the notes say so. The key stays schrock2024 (references.tsv).
#
# Taylor's power law (TPL): log10(variance) = log10(a) + b log10(mean) by ordinary least
# squares over groups (species x life stage x site x season x year with at least 10 swabs and
# at least 3 Bd-positive swabs), mean and sample variance (n - 1) of the load on the natural
# scale INCLUDING uninfected swabs (zeros). 95% intervals are lm confint (t quantiles).

source = { ref = "schrock2024", doi = "10.1098/rspb.2024.2013", review_ref = 60 }

[[parameter]]
symbol = "tpl_slope_sierra"
quantity = "Taylor's power law slope b, Sierra Nevada dataset (mountain yellow-legged frogs)"
value = 1.90
units = "1"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Rana muscosa / R. sierrae", setting = "field" }
location = "Results 3a; Fig. 1"
verified = true
notes = "95% CI 1.86-1.94. Same in the preprint."

[[parameter]]
symbol = "tpl_slope_brazil"
quantity = "Taylor's power law slope b, Brazil dataset (41 species)"
value = 2.06
units = "1"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", setting = "field" }
location = "Results 3a; Fig. 1"
verified = true
notes = "95% CI 1.99-2.12. Same in the preprint. The East Bay and eastern US slopes lie between 1.90 and 2.06 and are printed only in the Fig. 1 legend (raster)."

