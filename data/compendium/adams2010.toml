# Adams MJ, Chelgren ND, Reinitz D, Cole RA, Rachowicz LJ, Galvan S, McCreary B, Pearl CA,
# Bailey LL, Bettaso J, Bull EL, Leu M (2010) Using occupancy models to understand the
# distribution of an amphibian pathogen, Batrachochytrium dendrobatidis. Ecol Appl
# 20:289-302. https://doi.org/10.1890/08-2319.1
# VERSION CHECKED: the published PDF (lab/papers/adams2010/adams2010.pdf), 2026-11-20.
# Bd in anuran populations of Oregon and northern California, 2005-2006; a "survey" is one
# animal swabbed once. Logit-scale coefficients of the best a priori models (Tables 4 and 6)
# are for covariates standardised to mean 0, SD 1; "scale" is the SD of the original
# covariate as printed (divide β by it for the original units). Minus signs were checked in
# the PDF text layer (they are lost by some text extractions).

source = { ref = "adams2010", doi = "10.1890/08-2319.1", review_ref = 49 }

[[parameter]]
symbol = "finite_p_threshold"
quantity = "per-animal probability above which the finite-population factor is near 1"
value = 0.05
units = "probability"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", setting = "theory" }
location = "Introduction, 'The use of occupancy models...' ('For p′ > 0.05 and Ni > 50')"
verified = true

[[parameter]]
symbol = "finite_N_threshold"
quantity = "population size above which the finite-population factor is near 1"
value = 50
units = "animals"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", setting = "theory" }
location = "Introduction ('Ni > 50 for all i')"
verified = true

