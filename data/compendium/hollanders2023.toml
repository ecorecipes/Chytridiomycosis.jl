# Hollanders M, Grogan LF, Nock CJ, McCallum HI, Newell DA (2023) Recovered frog populations
# coexist with endemic Batrachochytrium dendrobatidis despite load-dependent mortality.
# Ecological Applications 33:e2724. https://doi.org/10.1002/eap.2724 (open access, CC BY)
#
# Read on 2026-11-15 from the paper (lab/papers/hollanders2023.pdf: Methods, Results,
# Figs 3–5), Appendix S1 and the authors' code and posterior draws (Zenodo
# doi:10.5281/zenodo.6981761; repository mhollanders/mfleayi-adults at a325a4c, in
# lab/papers/hollanders2023_si/). The PDF text layer drops minus signs; signs below were
# checked against the posterior draws.
#
# System: adult (86% male) Mixophyes fleayi, three rainforest streams, NSW, 2017–2021. All
# fitted values are posterior medians [95% HDI] of the NIMBLE robust-design continuous-time
# multistate model. Rates are hazards per six-week interval (42 days) unless the units say
# yr^-1; slopes are per two standard deviations of the centred covariate, reported
# conditional on RJMCMC inclusion. The load covariate is log10 ITS1 copies per swab, centred
# at 3.174 and divided by 2 × 0.911 (the mean and sd of the 248 observed loads).

source = { ref = "hollanders2023", doi = "10.1002/eap.2724", review_ref = 28 }

[[parameter]]
symbol = "mortality_status"
quantity = "change in log apparent mortality hazard for Bd infection status (infected at average load)"
value = -0.167
units = "log hazard ratio"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Mixophyes fleayi", stage = "adult", setting = "field" }
location = "Results, 'Apparent mortality rates' (−0.167 [−1.714, 1.053], pd 60%, 79.4% inclusion)"
verified = true
notes = "Median conditional on RJMCMC inclusion (checked against the draws)."

