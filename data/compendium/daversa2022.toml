# --- Spore inputs Φ(t) as used in the fit (authors' R code, Part 4) ------------------------
# The paper (p. 3) says zoospores were added on days 1, 11 and 18, to 18,000-24,000 zoospores
# per litre. The code that produced the estimates instead starts with Z(0) = 1.65e6 and adds
# three more doses on days 10, 17 and 25: four inputs, not three.

[[parameter]]
symbol = "Z0"
quantity = "zoospores in each tank at the start of the simulation (first inoculation)"
value = 1.65e6
units = "zoospores"
provenance = "M"
role = "structural"
location = "R code Part 4, `sporevals[1]` (Zenodo 10.5281/zenodo.5068208)"
verified = true

[[parameter]]
symbol = "dose_t1"
quantity = "day of the second inoculation in the fitted model"
value = 10.0
units = "day"
provenance = "M"
role = "structural"
location = "R code Part 4, `sporetime`"
verified = true
notes = "The paper text gives inoculation days 1, 11 and 18."

[[parameter]]
symbol = "dose_n1"
quantity = "zoospores added at dose_t1"
value = 1.94e6
units = "zoospores"
provenance = "M"
