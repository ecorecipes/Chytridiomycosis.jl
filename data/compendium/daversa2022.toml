# Daversa DR, Bosch J, Manica A, Garner TWJ, Fenton A (2022) Host identity matters, up to a
# point: the community context of Batrachochytrium dendrobatidis transmission. Am Nat 200(4).
# https://doi.org/10.1086/720638
# Checked 2026-11-12 against the PDF (lab/papers/daversa2022.pdf) and against the authors' R
# code (Zenodo, https://doi.org/10.5281/zenodo.5068208, saved as lab/papers/daversa2022_si1.Rmd).
# The supplemental PDF (tables S1-S8) could not be obtained: the publisher, eScholarship and
# UCL Discovery all returned 403 to scripted requests.
#
# Fitted values: the paper gives no numerical estimates, only Fig. 4a (posterior medians with
# 95% CIs). The values below were digitised from the embedded raster of Fig. 4a (page 10,
# 2250 x 2637 px at 385 ppi). Tick marks and marker centres were located by pixel analysis.
# One pixel is 2.9e-9 for β, 2.9e3 for λ and 0.0029 for σ. Because they are digitised, they
# have verified = false. The ratios they imply match the text: β_S is ~80% below the anurans,
# and λ_F is ~4 × λ_S.
#
# Species index: S salamanders (Salamandra salamandra larvae), T toads (Bufo spinosus larvae),
# F frogs (Hyla molleri larvae). Time unit: day. Z is the number of zoospores in an 80 L tank,
# not a density.
# Model equations (p. 5):
#   dH_i/dt = -μ_i H_i
#   dI_i/dt = β_i (H_i - I_i) Z - I_i (μ_i + σ_i)
#   dZ/dt   = Σ_k λ_k I_k + Φ(t) - Z (γ + Σ_k H_k β_k)
# μ_i is tank-specific, ln(H_i(0)/H_i(T))/T, and is computed from the data, not stored here.

source = { ref = "daversa2022", doi = "10.1086/720638" }

[[parameter]]
symbol = "γ"
quantity = "zoospore mortality rate (spores last 1 day on average)"
value = 1.0
units = "day^-1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", setting = "mesocosm" }
location = "p. 5, Methods, Species-Specific Contributions to Transmission (citing Longcore et al. 1999); R code Part 4 `gamma <- 1`"
verified = true

[[parameter]]
symbol = "β_S"
quantity = "transmission rate, salamander larvae (posterior median)"
value = 8.1e-8
units = "zoospore^-1 day^-1"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd GPL", host = "Salamandra salamandra", stage = "yearling larva", temperature_C = 18, setting = "mesocosm" }
location = "Fig. 4a (digitised)"
verified = false
uncertainty = { kind = "ci95", lo = 1.3e-8, hi = 2.15e-7 }
notes = "Digitised from Fig. 4a; 95% CI 1.3e-8 to 2.15e-7 (also digitised)."

