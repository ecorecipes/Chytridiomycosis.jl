# Briggs CJ, Knapp RA, Vredenburg VT (2010) Enzootic and epizootic dynamics of the chytrid fungal
# pathogen of amphibians. PNAS 107:9695-9700. https://doi.org/10.1073/pnas.0912886107
# Parameter set of Fig. 2 (panel C for ν and f). Time unit: days. Volume: arbitrary unit V.
# Read from the PMC article page (PMC2906864) via a summarising fetch, not from the PDF:
# verified = true until checked against the PDF and SI.

source = { ref = "briggs2010", doi = "10.1073/pnas.0912886107", review_ref = 10 }

[[parameter]]
