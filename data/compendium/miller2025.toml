# Miller CM, Lydeamore MJ, Flegg JA, Berger L, Skerratt LF, Waddle AW, Campbell PT (2025)
# Sunlight-heated refugia protect frogs from chytridiomycosis: a mathematical modelling study.
# arXiv:2503.06846. https://doi.org/10.48550/arXiv.2503.06846
# Checked against arXiv v3 (5 May 2025; lab/papers/miller2025.pdf). Table 3 and Table S1 are
# the same in v1 (10 Mar 2025). Not peer reviewed as of 2026-11-12: arXiv shows no journal
# reference. It is also Monash EBS working paper 6/25.
# Code-only constants were checked against the authors' code, Zenodo "Chytrid Model v1.0"
# (https://doi.org/10.5281/zenodo.15179344, 2025-04-09; lab/papers/code/miller2025/code).
# Their locators name the R file and line.
# Time unit: weeks (Table S1: "All rates are per week"). Frogs are counts per mesocosm.
# The base set holds the values the model runs at: the fixed constants and the Table 3
# posterior means. Named sets:
# - "code_priors": the priors in the Zenodo code, which differ from the paper's.
# - "synthetic": Table S2, the truth for Supplement S2.
# - "synthetic_posterior": Table S3.

source = { ref = "miller2025", doi = "10.48550/arXiv.2503.06846", review_ref = 14 }

