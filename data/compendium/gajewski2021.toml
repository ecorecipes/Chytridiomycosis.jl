# Gajewski Z, Stevenson LA, Pike DA, Roznik EA, Alford RA, Johnson LR (2021) Predicting the
# growth of the amphibian chytrid fungus in varying temperature environments. Ecol Evol
# 11:17920-17931. https://doi.org/10.1002/ece3.8379 (CC BY 4.0)
# Code and data: Zenodo doi:10.5281/zenodo.4525954 (V1.0, GitHub gzach93/Predict_Bd_Growth_
# VaryEnvir; licence "other-open", no licence file, so the data are not bundled).
#
# Checked on 2026-11-19 against the full text (PMC8717292: Tables 1 and 2) and Appendix S1
# (ECE3-11-17920-s001.pdf: Tables B.1-B.7), and against the authors' code (functions.R,
# TPCurves.R, RunModels.R, HierarchicalModel_*.bug, jags-logistic.bug).
#
# System: one Queensland Bd isolate (Paluma-Lgenimaculata #2-2011-CO) in TGhL broth, optical
# density at 492 nm minus the heat-killed controls. Constant-temperature data are those of
# Stevenson et al. (2013) (13, 15, 17, 19, 21, 23, 25, 26, 27, 28 degC, days 0-14); the three
# varying regimes (Dry Low Air, Wet High Frog, Wet Low Frog) are from Stevenson et al. (2020).
# Time in DAYS. Temperatures in degC except where the paper's curve is in kelvin (Ratkowsky
# Tmin/Tmax, Ikemoto TΦ/TL/TH): the fits used T + 273.15, the predictions T + 273.16.
#
# Sets: one per TPC ("briere2", "ratkowsky", "ikemoto", "logan10", "stinner") holding that fit's
# posterior medians (Appendix S1 Tables B.3-B.7; d and K from Table 2), its Table 1 summaries and
# its Table B.2 regime rates; "logistic_<regime>" for Table B.1; "prior*" for the JAGS priors
# (which the appendix also prints); "regime_<name>" for the piecewise temperature functions of
# the code. HDIs are 95% highest posterior density intervals as printed.

source = { ref = "gajewski2021", doi = "10.1002/ece3.8379", review_ref = 30 }

# --- Base set: shared by every fit -------------------------------------------------------------

[[parameter]]
symbol = "Y0"
quantity = "initial optical density Y0 (posterior median; the same in all five fits)"
value = 0.001
units = "OD"
uncertainty = { kind = "hdi95", lo = 0.001, hi = 0.00104, as_printed = "All median values for Y0 are 1e-3 and all models have an interval that falls between (1e-3, 1.04e-3)" }
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", isolate = "Paluma-Lgenimaculata #2-2011-CO (QLD)", setting = "culture, TGhL broth, optical density at 492 nm" }
location = "Table 2, notes"
verified = true

[[parameter]]
