# Mosher BA, Bailey LL, Muths E, Huyvaert KP (2018) Host-pathogen metapopulation dynamics
# suggest high elevation refugia for boreal toads. Ecol Appl 28:926-937.
# https://doi.org/10.1002/eap.1699
# Data: Dryad doi:10.5061/dryad.1c990 (CC0), not downloaded (Dryad file API needs a login).
#
# VERSION CHECKED: the published article is paywalled and was NOT read. Every record below
# was read on 2026-11-19 from the first author's PhD dissertation (Mosher BA 2017, Colorado
# State University, Mountain Scholar), lab/papers/mosher2018/mosher_dissertation_2017.pdf:
# Chapter 1 (published separately as Mosher et al. 2018 Ecography 41:32) and Chapter 2
# (the pre-publication version of the Ecol Appl paper). They are therefore all
# verified = false: checked against the dissertation, not against the paper.
#
# The base set and set "rare_susceptible" are the "true" values of dissertation Table 1.3,
# used there to generate expected-value data: the SRM scenario was chosen to mimic the boreal
# toad-Bd system of the southern Rocky Mountains; they are scenarios (role "scenario",
# provenance A), not estimates. Probabilities are per year (ψ, γ, ε) or per survey (p, r).
# States: A toad only, B Bd only, U neither, AB both.

source = { ref = "mosher2018", doi = "10.1002/eap.1699", review_ref = 43 }

