# Mosher BA, Bailey LL, Muths E, Huyvaert KP (2018) Host-pathogen metapopulation dynamics
# suggest high elevation refugia for boreal toads. Ecol Appl 28:926-937.
# https://doi.org/10.1002/eap.1699
# Data: Dryad doi:10.5061/dryad.1c990 (CC0), bundled in data/mosher2018.
#
# VERSION CHECKED (2026-11-20): the published records below (verified = true) were read from
# the ACCEPTED MANUSCRIPT of the article (Wiley "Accepted Article", not copyedited;
# lab/papers/mosher2018/mosher2018.pdf). Its methods, Table 3 and estimates are identical to
# Chapter 2 of the first author's PhD dissertation (Mosher 2017, Colorado State University),
# which was used for the first version of this file. Both state 82 sites; the Dryad deposit
# has 83 (Site 33 has no covariates and is dropped).
#
# The base set and set "rare_susceptible" are NOT from the Ecol Appl paper: they are the
# "true" values of dissertation Ch. 1 Table 1.3 (published as Mosher et al. 2018, Ecography
# 41:32, not checked), used there to generate expected-value data; the SRM scenario mimics
# the boreal toad-Bd system. They are scenarios (role "scenario", provenance A,
# verified = false). Probabilities are per year (ψ, γ, ε) or per survey (p, r). States: A toad
# only, B Bd only, U neither, AB both.

source = { ref = "mosher2018", doi = "10.1002/eap.1699", review_ref = 43 }

