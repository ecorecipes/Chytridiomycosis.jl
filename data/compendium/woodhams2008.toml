# Woodhams DC, Alford RA, Briggs CJ, Johnson M, Rollins-Smith LA (2008) Life-history trade-offs
# influence disease in changing climates: strategies of an amphibian pathogen. Ecology
# 89:1627-1639. https://doi.org/10.1890/06-1842.1
# Checked against the PDF (James Cook University repository copy), 2026-11-11.
# Bd isolate 98-1469/10 (from Limnodynastes dumerilii), in culture. Time unit: hours.
# Sets "10C" and "23C": Table 2, the best estimates used in the population model (Eq. 7).
# Sets "table1_*": Table 1, zoospore death and encystment rates at four temperatures.
# Note: the Results text gives F = 160.5 "at 9 degC"; Table 2 lists it under 10 degC.

source = { ref = "woodhams2008", doi = "10.1890/06-1842.1", review_ref = 101 }

