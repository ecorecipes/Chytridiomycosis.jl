# Palomar G, Fernández-Chacón A, Bosch J (2023) Amphibian survival compromised by long-term
# effects of chytrid fungus. Biodiversity and Conservation 32:793–809.
# https://doi.org/10.1007/s10531-022-02525-3 (open access, CC BY)
#
# Read on 2026-11-15 from the paper (lab/papers/palomar2023.pdf: Methods, Results, Table 1,
# Figs 2–4) and Online Appendices A and B (lab/papers/palomar2023_si1.docx, _si2.docx).
# System: adult male Bufo spinosus, Laguna Grande, Peñalara Massif, Sierra de Guadarrama
# National Park, Spain; 13 annual breeding-season occasions 2006–2018. Fitted values are
# E-SURGE maximum-likelihood estimates of the retained multi-event model (Table 1, model 1:
# S state + time, ψ state × time, p time, δ state), reported as "mean annual" estimate ± SE
# (means over the time-specific estimates; how the mean and its SE were formed is not stated).
# The capture histories were not deposited ("Data will be available online upon
# publication"; nothing found 2026-11-15), so none of these is refitted.

source = { ref = "palomar2023", doi = "10.1007/s10531-022-02525-3", review_ref = 58 }

[[parameter]]
symbol = "survival_infected"
quantity = "mean annual apparent survival of Bd-positive males, S_I"
value = 0.754
units = "probability per annual interval"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Bufo spinosus", stage = "adult male", setting = "field" }
location = "Results, 'Survival, transition, recapture…' (± 0.016 SE)"
verified = true
notes = "An annual probability, not a rate; SE 0.016."

