# Hardy BM, Muths E, Lambert BA, Schneider SC, Funk WC, Bailey LL (2023) Compensatory recruitment
# unlikely in high-elevation amphibian populations challenged with disease. J Appl Ecol
# 60:400-411. https://doi.org/10.1111/1365-2664.14310
# Data: Dryad doi:10.5061/dryad.fttdz08wv (CC0), bundled in data/hardy2023/.
#
# VERSION CHECKED: the journal PDF and Supporting Information could not be downloaded (Wiley
# bot check). Every record was read on 2026-11-19 from Chapter 1 and its Appendices S1-S6 of
# B. M. Hardy's PhD dissertation, "Of toads and tolerance" (Colorado State University, 2023;
# mountainscholar.org, lab/papers/hardy2023/hardy2023_dissertation.pdf), which reprints the
# paper with the note "Originally published as: Hardy et al. (2023) ... J Appl Ecol,
# doi:10.1111/1365-2664.14310". Locations below are those of the dissertation (Table 1.1 etc.;
# the journal numbers Table 1 etc.). `verified = true` means checked against that text.
#
# System: Bd and adult male boreal toads (Anaxyrus boreas boreas), five breeding sites in
# Chaffee County, Colorado, 1998-2020. Time unit: one year (primary periods are breeding
# seasons). Robust-design Pradel model in Program MARK: apparent survival φ (logit link),
# per-capita recruitment f (log link), capture probability p (logit), λ = φ + f.
# "±" values are standard errors (the paper writes "(SE=…)"), stored in separate `_se`
# records. ELEV coefficients are per 100 m of elevation (elevation was divided by 100).

source = { ref = "hardy2023", doi = "10.1111/1365-2664.14310", review_ref = 45 }

