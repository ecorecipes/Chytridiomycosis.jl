system = { pathogen = "Bsal", host = "Salamandra salamandra", stage = "adult" }
location = "Appendix A1: 1/δ = 40 + 4b days, b = (5 - 40)/(15 - 5)"
verified = true
notes = """
Linear interpolation of Stegen et al. (2017) to 4 °C above 5 °C; 40 - 14 = 26 days. The
paper's aestivation results (R0 2.13, Floquet-R0 1.92 and 1.80) and the shape of its Fig. 2b
R0(t) curve both imply about 28.7 days instead (δ0 = 42.74, δ1 = 0.703), a value fitted here
and not derivable from the appendix; see bozzuto2019_R0_aestivation in
data/validation/targets.toml. The package keeps the documented 26 days."""

