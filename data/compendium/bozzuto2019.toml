verified = true
notes = """
Table 1 prints 0.90 (set "hibernation_table1"). Only 0.95 reproduces Floquet-R0 = 8.27
(0.90 gives 8.67), the numerical 8.33 (0.90: 8.71) and the Fig. A5 elasticities
(c1 0.73, c2 -0.92, ℓc 2.37). Table 1's 0.90 is taken to be a typesetting error."""

