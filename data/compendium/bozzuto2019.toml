# Bozzuto C, Canessa S (2019) Impact of seasonal cycles on host-pathogen dynamics and disease
# mitigation for Batrachochytrium salamandrivorans. Glob Ecol Conserv 17:e00551.
# https://doi.org/10.1016/j.gecco.2019.e00551
# Checked against the PDF (Table 1, p. 3; text pp. 2-4) and the online Appendix A
# (Elsevier mmc1.docx, saved as lab/papers/bozzuto2019_si/bozzuto2019_appendixA.docx).
# Time unit: decimal years (t = 0 is the start of January). Densities: salamanders per hectare.
#
# Sets: the base set holds values shared by both populations. "hibernation" (north-western
# Europe) and "aestivation" (coastal NE Spain) are the two Table 1 populations. The
# "*_high_activity" sets substitute c1 and c2 for the ~25% winter/summer activity of Fig. A4.
# "hibernation_table1" holds Table 1's printed c2 = 0.90 (see its notes). "fig1a_solid",
# "fig1a_dotted" and "fig1b" are the contact cycles of Fig. 1 (extremes of the general
# analysis). BozzutoParameters(:bozzuto2019; population, activity) layers these sets.

source = { ref = "bozzuto2019", doi = "10.1016/j.gecco.2019.e00551", review_ref = 40 }

# --- Shared by both populations ---------------------------------------------------------------

[[parameter]]
symbol = "p0"
quantity = "mean proportion of contacts that transmit Bsal, p(t) = p0 (1 - p1 cos 2πt)"
value = 1.0
units = "1"
provenance = "A"
role = "structural"
system = { pathogen = "Bsal", host = "Salamandra salamandra", stage = "adult" }
location = "Table 1; Appendix A1"
verified = true
notes = "As in Canessa et al. 2018, so that c0 equals their transmission rate β."

[[parameter]]
symbol = "p1"
quantity = "amplitude of the seasonal transmission proportion p(t)"
value = 0.0
units = "1"
provenance = "A"
role = "structural"
system = { pathogen = "Bsal", host = "Salamandra salamandra", stage = "adult" }
location = "§2.4 (p. 4); Appendix A1"
verified = true
notes = "Set to zero for lack of data ('p1 = k1 = 0')."

[[parameter]]
symbol = "lifespan"
quantity = "adult life expectancy, 1/d (natural mortality d is constant)"
value = 8.0
units = "yr"
provenance = "M"
role = "estimated"
system = { pathogen = "none", host = "Salamandra salamandra", stage = "adult" }
location = "Table 1 (Sparreboom 2014; Thiesmeier 2004)"
verified = true

[[parameter]]
symbol = "infective_period_warm"
quantity = "shortest infective period 1/δ (at 15 °C), used for both populations"
value = 5.0
units = "day"
provenance = "M"
role = "estimated"
system = { pathogen = "Bsal", host = "Salamandra salamandra", stage = "adult", temperature_C = 15.0, setting = "lab" }
location = "Appendix A1 (from Stegen et al. 2017)"
verified = true
notes = "δ0 = (min δ + max δ)/2 and δ1 = max δ/δ0 - 1, with a 364-day year (days_per_year)."

[[parameter]]
symbol = "days_per_year"
quantity = "days per year used to convert the infective periods into δ(t) (yr^-1)"
value = 364.0
units = "1"
provenance = "D"
role = "structural"
system = { pathogen = "Bsal", host = "Salamandra salamandra" }
location = "inferred: Table 1 δ0 and δ1 are reproduced only with 364 days (365 gives δ0 = 41.06)"
verified = true
notes = "Not stated in the paper. 364/5 = 72.8 and 364/40 = 9.1 give δ0 = 40.95, δ1 = 0.7778."

[[parameter]]
symbol = "contact_ratio"
quantity = "ratio of proportional cumulative contacts above/below the mean, April-December (hibernation cycle)"
value = 1.1643
units = "1"
provenance = "D"
role = "structural"
system = { pathogen = "Bsal", host = "Salamandra salamandra", setting = "Belgium" }
location = "Appendix A1"
verified = true
notes = "c0 = β_y/1.1643, where β_y is the Canessa et al. (2018) final-size estimate in yr^-1."

