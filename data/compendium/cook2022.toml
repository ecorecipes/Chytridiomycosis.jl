# Cook K, Pope K, Cummings A, Piovia-Scott J (2022) In situ treatment of juvenile frogs for
# disease can reverse population declines. Conservation Science and Practice 4:e12762.
# https://doi.org/10.1111/csp2.12762 (CC BY 4.0).
#
# VERSION CHECKED: the published article (PDF from the US Forest Service Treesearch record
# 64973, lab/papers/cook2022/cook2022.pdf), read on 2026-11-19. Only main-text values are
# entered. The stage-structured projection model (Figure S3, Table S2: adult and subadult
# survival, growth and per-female fecundity from a Bayesian Jolly-Seber model) is in the
# Supporting Information, which could not be downloaded (Wiley bot check), and the US Forest
# Service Research Data Archive accession promised in the data availability statement was not
# found. The projection is therefore not implemented; its outputs are pending targets.
#
# System: Bd and Cascades frog (Rana cascadae) metamorphs, three wet meadows in northern
# California, treated in September 2018 with itraconazole (0.0025%, 5 min, 6 days). Survival
# is apparent overwinter survival (fall 2018 to the first 2019 survey) from a Bayesian CJS
# model; uncertainty is the 95% credible interval.

source = { ref = "cook2022", doi = "10.1111/csp2.12762", review_ref = 39 }

[[parameter]]
symbol = "phi_overwinter_treated"
quantity = "apparent overwinter survival of itraconazole-treated metamorphs"
value = 0.48
units = "per winter"
uncertainty = { kind = "ci95", lo = 0.21, hi = 0.86, as_printed = "95% credible interval" }
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Rana cascadae", stage = "metamorph", setting = "field, wet meadows, northern California, USA" }
location = "Results 3.2 ('0.48, 95% credible interval: 0.21–0.86'); Fig. 2"
verified = true
notes = "Posterior mean. Used in the projection as the survival of treated metamorphs."

[[parameter]]
symbol = "phi_overwinter_field_control"
quantity = "apparent overwinter survival of field-control metamorphs (marked, untreated, not held)"
value = 0.11
units = "per winter"
uncertainty = { kind = "ci95", lo = 0.03, hi = 0.29, as_printed = "95% credible interval" }
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Rana cascadae", stage = "metamorph", setting = "field, wet meadows, northern California, USA" }
location = "Results 3.2 ('(0.11, 0.03–0.29)'); Fig. 2"
verified = true
notes = "Posterior mean. Used in the projection as the survival of untreated metamorphs."

[[parameter]]
symbol = "phi_overwinter_experimental_control"
quantity = "apparent overwinter survival of sham-treated experimental-control metamorphs"
value = 0.02
units = "per winter"
uncertainty = { kind = "ci95", lo = 0.001, hi = 0.06, as_printed = "95% credible interval" }
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Rana cascadae", stage = "metamorph", setting = "field, wet meadows, northern California, USA" }
location = "Results 3.2 ('(0.02, 0.001–0.06)'); Fig. 2"
verified = true
notes = "Posterior mean. Not used in the projection."

[[parameter]]
symbol = "treatment_concentration"
quantity = "itraconazole concentration of the treatment bath"
