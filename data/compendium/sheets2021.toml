# --- Supplementary Material (Data_Sheet_1.PDF, 30 pages; checked 2026-11-20) ---------------------
# The supplement is the rendered R Markdown of the figshare code: it prints the logistic fits
# (r_fit, K_fit) and their profile-likelihood 95% intervals. It contains NO Johnson-Lewin curves
# or fitted values, although the main text refers to it for them. Its fits differ from Table 2
# for TN, OH, VT at 4 degC, TN 26 and OH 25 degC (and the unidentified LA 26/27, VT 26/27); they
# equal what the deposited code gives on the deposited data. found = FALSE marks a bound at the
# edge of the authors' grid (not a crossing).

