# Chowdhury MM, Gray MJ, Carter ED, Woodhams DC, McCartney JA, Surles JG, Nelms KM, Gan H,
# Peace A (2025) Fungal pathogen transmission dynamics in North American salamanders:
# mathematical insights for disease management. Ecol Model 501:111028.
# https://doi.org/10.1016/j.ecolmodel.2025.111028
#
# Read on 2026-11-13 from the published PDF (lab/papers/chowdhury2025.pdf: §§2-6, Table 2,
# Table 3, Figs 1, 4, 5, 7, 9) and the online supplement (Elsevier mmc1.pdf, Appendices A-H,
# saved as lab/papers/chowdhury2025_si/mmc1.pdf). No code or data were deposited ("Data will
# be made available on request").
#
# Re-checked on 2026-11-14 against the data behind the parameters: Carter et al. (2021, PLoS
# Pathog 17:e1009234, doi:10.1371/journal.ppat.1009234; S1 and S2 Tables) and Gray et al.
# (2023, Nat Commun 14:3270, Supplementary Table 1), saved under
# lab/papers/chowdhury2025_si/{carter2021,gray2023_si}/. The NSF Public Access copy of the
# paper (accepted manuscript, lab/papers/chowdhury2025_si/preprint/nsf_par.pdf) has the same
# text and tables as the published PDF. The SSRN preprint (doi:10.2139/ssrn.4998606) could not
# be retrieved (the site refuses automated clients).
#
# System: eastern newt (Notophthalmus viridescens) and Bsal; larvae, efts (terrestrial) and
# adults (aquatic). Time unit: days. Host densities per m². ID50 κ_j is in zoospores per m² of
# soil (assumed) and κ_a in zoospores per mL of water (Gray et al. 2023), and the paper compares
# the zoospore pools with them directly; see the units note in src/models/chowdhury2025.jl.
#
# Sets: the base set holds values shared by both temperatures and the simulated densities.
# "6C" and "14C" hold Table 2's temperature-specific values. "<T>C_table3" substitutes the
# values that reproduce Table 3 (derived here; see notes). "<T>C_as_printed" substitutes text
# values that contradict Table 2. ChowdhuryParameters(:chowdhury2025; temperature, variant,
# as_printed) layers them in that order. The one exception to "6C holds Table 2" is κ_j: Table
# 2 prints 10,000 for both temperatures, but the paper used the eft ID50 of Appendix C at 6 °C
# (see the 6C κ_j record); eft_id50 = :table2 restores the printed value.
#
# Durations are stored as durations (larval_period, eft_period, adult_lifespan); the model
# uses their reciprocals, as Table 2 does (η_j = 1/105, η_a = 1/(3 × 365), δ_a = 1/(10.5 × 365)).

source = { ref = "chowdhury2025", doi = "10.1016/j.ecolmodel.2025.111028", review_ref = 43 }

# --- Life cycle (both temperatures) -------------------------------------------------------------

[[parameter]]
symbol = "λ"
quantity = "birth rate of larvae per adult"
value = 0.82
units = "eggs adult^-1 day^-1"
provenance = "D"
role = "estimated"
system = { pathogen = "none", host = "Notophthalmus viridescens", stage = "adult", setting = "literature" }
location = "Table 2; Appendix C (Birth rate)"
verified = true
notes = "From 200-400 eggs per female per breeding season (Petranka 1998): 300/365 = 0.82. Applied to all adults (A), not females. With this value the simulated efts grow several-fold within months, unlike Figs 4 and E.1 (see the validation targets). Table 3 (R_j, R_a) needs this value through S_j* and S_l*, but the simulations of Figs 4, 5 and 7 behave as if λ were about 0.82/24 = 0.034 (implied by fitting Figs 4a, b, e, f and 7; best divisor 24, range 22-25); not printed, so not used."

