units = "zoospores m^-2"
provenance = "D"
role = "estimated"
system = { pathogen = "Bsal", host = "Notophthalmus viridescens", stage = "eft", temperature_C = 6.0, setting = "lab, 10-mL water bath exposure" }
location = "Appendix C (ID50/LD50: 'adapted ... from the literature for ... eft (6 C)'); Fig. 5a (ID50 line, right axis); Carter et al. 2021, S1 Table"
verified = false
notes = "Not in Table 2, which prints 10,000 for both temperatures. Read from the ID50 line of Fig. 5a: 3,348 ± 6 (600-dpi rendering; the same reading of Fig. 5b gives 10,000 exactly). Its source: the eft LD50 at 6 °C from Carter et al. (2021, S1 Table: 5/6 efts dead at 5e3 zoospores per 10 mL, 6/6 at 5e4-5e6), which a log-probit fit (glm, binomial probit on log dose, MASS::dose.p, as in Gray et al. 2023) puts at 3,373; the same fit gives 5,443.8 and 2,897.0 from the adult infection data, Table 2's κ_a (5,443, 2,895). The fit is degenerate (one partial response), so variants of it give 3,300-3,460. The eft ID50 (4/6 infected at 5e3) would be 4,258. Table 3's R_j at 6 °C (with variant = :table3) needs κ_j = 3,339; this value gives it to 0.25%. Units as for κ_j (a dose per 10 mL treated as per m²)."

