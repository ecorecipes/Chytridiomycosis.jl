units = "zoospores m^-2"
provenance = "A"
role = "uncertain"
system = { pathogen = "Bsal", host = "Notophthalmus viridescens", stage = "eft", temperature_C = 14.0, setting = "lab soil" }
location = "Table 2; Appendix C (ID50); Appendix A, Table A.1"
verified = true
notes = "Assumed: the order of magnitude of the mean of the two soil doses of Appendix A (5e3 and 5e5 zoospores per gram of soil in 50-mL vials; 0/30 and 27/30 adults infected), with the 'conservative assumption' that the vial concentration over 24 h corresponds to the same number per m². The experiment used adult newts, not efts. Table 2 prints this value for both temperatures, but Appendix C says only the 14 °C value comes from Appendix A and the 6 °C eft value from the literature; Fig. 5b draws the ID50 line at 10,000 (14 °C) and Fig. 5a at ~3,350 (6 °C). Used at 14 °C; at 6 °C only with eft_id50 = :table2. The simulated f_j of Fig. 7 (middle) behaves as if the half-saturation were κ_j/24 at both temperatures (fit of Fig. 7 against Fig. 5: 10,000/420 = 23.8 and 3,350/139 = 24.1); Table 3 and the Fig. 5 ID50 lines use κ_j itself. Not printed, so not used."

