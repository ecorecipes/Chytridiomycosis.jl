# Woodhams DC, Bosch J, Briggs CJ, Cashins S, Davis LR, Lauer A, Muths E, Puschendorf R,
# Schmidt BR, Sheafor B, Voyles J (2011) Mitigating amphibian disease: strategies to maintain
# wild populations and control chytridiomycosis. Frontiers in Zoology 8:8.
# https://doi.org/10.1186/1742-9994-8-8 (open access, CC BY 2.0; PMC3098159).
#
# VERSION CHECKED: the PMC full text (Europe PMC XML of PMC3098159, which includes the
# Appendix "Mathematical Models" and the extended legend of Figure 6) and the equation images
# of that rendering, read on 2026-11-19. The publisher PDF could not be downloaded (bot
# challenge), so the PDF typesetting of the equations was not seen.
#
# The model is the Briggs et al. (2010) load model with an added antibody equation. Time in
# days, loads in sporangia per frog, zoospores per pool. All values are from the Figure 6
# extended legend (Appendix). They are simulation settings, not fitted estimates (provenance
# A). The legend writes "γ*Z" and "η*f": these are the products (γ/V)Z and ηf, the only
# combinations that enter the single-frog model. Figure 6C and 6D do NOT print the antibody
# production rate r, the antibody decay rate c, or (6D) the zoospore death rate μ, so those
# figures cannot be rebuilt from the paper: see the pending targets.
#
# Sets: fig6b (single frog, constant pool, no adaptive immunity; treatments on day 20),
# fig6c (single frog with adaptive immunity; antifungal on day 30), fig6d (population of
# frogs with adaptive immunity and a dynamic pool; density reduced on day 30).

source = { ref = "woodhams2011", doi = "10.1186/1742-9994-8-8", review_ref = 27 }

[[parameter]]
symbol = "σ"
quantity = "loss rate of sporangia from a host (1/σ is the mean sporangium lifespan)"
value = 0.2
units = "day^-1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", host = "frog (generic)" }
location = "Appendix, Figure 6 extended legend (B, C and D)"
verified = true

[[parameter]]
symbol = "Smax"
quantity = "fungal load at which a frog dies"
value = 10000.0
units = "sporangia host^-1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", host = "frog (generic)" }
location = "Appendix, Figure 6 extended legend (B): 'S max = 10000 sporangia'"
verified = true
notes = "Printed only in the 6B legend. Figures 6C and 6D draw the Smax line at the same 10,000, and their legends call it 'the lethal threshold'."

[[parameter]]
set = "fig6b"
symbol = "ν"
quantity = "fraction of zoospore encounters that infect the frog (no antibodies)"
value = 0.25
units = "dimensionless"
provenance = "A"
role = "default"
system = { pathogen = "Bd", host = "frog (generic)", setting = "single frog in a constant zoospore pool" }
location = "Appendix, Figure 6 extended legend (B): 'ν = 0.25'"
verified = true

[[parameter]]
set = "fig6b"
symbol = "γZ"
quantity = "zoospores from the constant pool encountering the frog, (γ/V)Z"
value = 500.0
units = "zoospores day^-1"
provenance = "A"
role = "default"
system = { pathogen = "Bd", host = "frog (generic)", setting = "single frog in a constant zoospore pool" }
location = "Appendix, Figure 6 extended legend (B): 'γ*Z = 500 zoospores/day'"
verified = true

[[parameter]]
set = "fig6b"
symbol = "ηf"
quantity = "zoospores released per sporangium that immediately re-encounter the same frog, ηf"
value = 1.0
units = "zoospores sporangium^-1 day^-1"
provenance = "A"
role = "default"
system = { pathogen = "Bd", host = "frog (generic)" }
location = "Appendix, Figure 6 extended legend (B): 'η*f = 1 zoospores/sporangia/day'"
verified = true

[[parameter]]
set = "fig6b"
symbol = "S0"
quantity = "initial load"
value = 1.0
units = "sporangia host^-1"
provenance = "A"
role = "scenario"
location = "Appendix, Figure 6 extended legend (B): 'S(0) = 1 sporangia'"
