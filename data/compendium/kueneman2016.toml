# Kueneman JG, Woodhams DC, Harris R, Archer HM, Knight R, McKenzie VJ (2016) Probiotic
# treatment restores protection against lethal fungal infection lost during amphibian
# captivity. Proc R Soc B 283:20161553. https://doi.org/10.1098/rspb.2016.1553
# Trial outcomes, not model parameters. First copied from a literature review; checked against
# the full text (eScholarship author copy, escholarship.org/uc/item/25p823wx, read 2026-11-19):
# Results, Fig. 4b and Fig. 5 with its legend. Second Bd challenge, after earlier treatments and
# repeated bacterial applications. All 31 exposed toads became infected, yet survival with
# J. lividum was 40 percentage points higher (Mantel-Cox chi2 = 6.021, p = 0.0141), with only "a
# trend toward lower Bd loads": better survival without fewer infections. Death counts are not
# reported, and 60% of 21 is not a whole number (the Kaplan-Meier curve ends at 40% survival).

source = { ref = "kueneman2016", doi = "10.1098/rspb.2016.1553" }

[[parameter]]
symbol = "n_control"
quantity = "toads assigned to the Bd-only group"
value = 10
units = "toads"
provenance = "M"
role = "uncertain"
system = { pathogen = "Bd", host = "Anaxyrus boreas", stage = "juvenile" }
location = "Results; Figure 5 and legend"
verified = true

