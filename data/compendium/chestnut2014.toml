# Chestnut T, Anderson C, Popa R, Blaustein AR, Voytek M, Olson DH, Kirshtein J (2014)
# Heterogeneous occupancy and density estimates of the pathogenic fungus Batrachochytrium
# dendrobatidis in waters of North America. PLoS ONE 9:e106790.
# https://doi.org/10.1371/journal.pone.0106790
# Checked against the PDF, 2026-11-14. Filtered pond water (20-600 mL per sample), qPCR with
# a SYBR green kit. Densities are reported as "zoospores per L" after dividing the qPCR
# quantity by a conversion factor of 169 copies per zoospore from their own dilution series,
# so "genomic equivalents are 169 times greater than the numbers we report" (Methods). 169 is
# above the 10-144 copies per zoospore Longo et al. (2013) found among eight strains.

source = { ref = "chestnut2014", doi = "10.1371/journal.pone.0106790", review_ref = 50 }

[[parameter]]
symbol = "copies_per_zoospore"
quantity = "conversion factor from qPCR genomic equivalents to reported zoospores"
value = 169.0
units = "copies zoospore^-1"
provenance = "M"
role = "structural"
system = { pathogen = "Bd", setting = "lab" }
location = "Methods, laboratory methods"
verified = true

[[parameter]]
symbol = "quantitative_limit"
quantity = "qPCR detection limit for a quantitative result"
value = 10.0
units = "genomic equivalents"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", setting = "field" }
location = "Discussion"
verified = true

[[parameter]]
symbol = "density_mean"
quantity = "overall mean zoospore density over the 41 sites"
