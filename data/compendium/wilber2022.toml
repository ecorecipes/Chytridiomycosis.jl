# Wilber MQ, Knapp RA, Smith TC, Briggs CJ (2022) Host density has limited effects on pathogen
# invasion, disease-induced declines and within-host infection dynamics across a landscape of
# disease. Journal of Animal Ecology 91:2451–2464. https://doi.org/10.1111/1365-2656.13823
#
# Read on 2026-11-14 from the accepted manuscript (NSF Public Access Repository 10401712,
# lab/papers/wilber2022_si/nsfpar/accepted.pdf: eqns 1–2, Table 1, Figs 2–6, Results) and the
# authors' deposit (Zenodo doi:10.5281/zenodo.7114634, mqwilber/host_density_and_bd v1.0.0,
# lab/papers/wilber2022_si/zenodo7114634/). Appendices S1–S4 were not obtained (Wiley 403; the
# PMC author manuscript PMC12594071 is behind a browser check).
#
# System: Rana sierrae/R. muscosa lake populations, Sequoia–Kings Canyon and Yosemite,
# 2004–2019. Every value here is a posterior summary fitted by the authors in Stan. None is
# an input of a mechanistic model; they are reproduction targets for the refits in
# src/fitting/wilber2022.jl.
#
# Sets:
# - base: Hypothesis 2 (Fig. 5, text) and Hypothesis 3 (translocation, text).
# - "abundance_rho0.25", "abundance_rho0.33", "abundance_rho0.5": Fig. 3 effect sizes of the
#   full HMM (eqn 1) with host abundance, at the three prevalence cutoffs ρ (0.33 is 0.3333 in
#   the code). "density_rho…": the same with host density (count per metre of shoreline).
#   The covariates are z-scored over the 79 lakes × 16 years (tadpole presence is not), so
#   slopes are per sd. Fig. 3 prints the medians and 95% intervals only as a figure; the values
#   are digitised from the deposit's results/effect_sizes_across_rhos_rarifyFALSE.jpg (the
#   same estimates as Fig. 3 on panel-specific axes, 1800×2400 px; pixel resolution 0.002 on
#   most panels, 0.01 on "φ, tadpole"), checked by eye against Fig. 3 of the manuscript.

source = { ref = "wilber2022", doi = "10.1111/1365-2656.13823", review_ref = 47 }

# --- Hypothesis 2: magnitude of decline (eqn 2, Fig. 5) ------------------------------------------

[[parameter]]
symbol = "decline_slope_adult_abundance_lower"
quantity = "lower 95% bound of the slope β1 of logit expected decline on z-scored log10 maximum adult count"
value = -0.1
units = "logit per sd of log10 count"
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", host = "Rana sierrae/R. muscosa", stage = "adult", setting = "field" }
location = "Fig. 5A (printed '95% CI: [−0.1, 0.7]'); 52 lakes"
verified = true
notes = "Beta-binomial regression of the decline from maximum to minimum count; Stan, β1 ~ Normal(0, 5)."

