# Wilber MQ, Langwig KE, Kilpatrick AM, McCallum HI, Briggs CJ (2016) Integral projection
# models for host–parasite systems with an application to amphibian chytrid fungus.
# Methods Ecol Evol 7:1182–1194. https://doi.org/10.1111/2041-210X.12561
#
# Read on 2026-11-13 from the published PDF (lab/papers/wilber2016.pdf: eqns 7–13, Table 1,
# "Analysing the IPM", "Exploring density-dependent transmission dynamics", Figs 2–5) and the
# authors' GitHub repository mqwilber/ipm_for_parasites (commit 240b5e67, saved in
# lab/papers/wilber2016_si/repo/): code/*.R and results/IPM_parameters_no_26_linear.rds. The
# data are on Dryad (doi:10.5061/dryad.06sd9, CC0) and bundled as data/wilber2016/. The
# journal's Appendices S1–S3 could not be retrieved (HTTP 403); the R code is the record of
# what they contain (R0 in R0_calculation.R, eviction in eviction_functions.R).
#
# System: adult Rana muscosa/R. sierrae (the data file says R. sierrae) and Bd. One time step
# is 3 days (the swabbing interval). Loads: x is the NATURAL log of the qPCR zoospore load in
# zoospore equivalents per swab, x = ln(ZE swab^-1), for x ≠ 0; uninfected is a separate
# class, not x = 0. T is temperature in °C. Vital-rate probabilities are per 3-day step.
#
# Sets:
# - base: Table 1 as printed (3–4 significant figures), the mesh, the time step and the
#   simulation design.
# - "deposited": the authors' fitted values at full precision, read from
#   results/IPM_parameters_no_26_linear.rds (parsed with a minimal XDR reader; see notes).
#   They agree with Table 1 to the printed digits except the survival function: the deposit
#   has b00 = 11.597, b10 = −0.8873 where Table 1 prints 11.824, −0.8605. A refit of the
#   bundled data (fit_wilber2016) reproduces the deposit, not Table 1.

source = { ref = "wilber2016", doi = "10.1111/2041-210X.12561", review_ref = 38 }

