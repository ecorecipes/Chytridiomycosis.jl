# Doddington BJ, Bosch J, Oliver JA, Grassly NC, Garcia G, Schmidt BR, Garner TWJ, Fisher MC
# (2013) Context-dependent amphibian host population response to an invading pathogen.
# Ecology 94:1795-1804. https://doi.org/10.1890/12-1270.1
# Supplements (Ecological Archives E094-163, figshare collection doi:10.6084/m9.figshare.c.3306075,
# CC0): Appendix A (state-space trends), Appendix B (model equations B.1-B.8, Table B1, outputs)
# and Supplement 1 (the authors' Berkeley Madonna code, model_code.txt).
#
# VERSION CHECKED: every record was read on 2026-11-19 from the PUBLISHED version (PDF of
# record from ZORA, lab/papers/doddington2013/doddington2013_zora.pdf), Appendix B
# (lab/papers/doddington2013/appendix-B.pdf) and Supplement 1 (model_code.txt).
#
# System: Alytes muletensis (Mallorcan midwife toad), Bd (BdCAPE TF5a1 on Mallorca; BdGPL
# UKTvB in the exposure trial). Time unit: YEAR (all rates in Table B1 are yr^-1; the code's
# TIME is in years). Zoospores are numbers in one pond (ν "scaled to a pond of volume 1200
# litres" from Mitchell et al. 2008).
#
# Base set = Table B1 (Appendix B). The timing parameters of Table B1 are days of the year;
# the code (set "code") uses fractions of a year (0.249 = day 90.9, etc.), which round to the
# Table B1 days. Set "code" also holds the code-only settings: the starting adult population,
# the zoospore introduction, the time step and the run length.
#
# α: Table B1 prints 2.97 yr^-1 (BdGPL); Table 1 of the paper prints 2.98 for the same
# quantity. 4.54 (the upper 95% limit of the BdGPL rate) is the "high virulence" value of
# Fig. 3a and Appendix B; 0.61 (BdCAPE) is the "weak virulence" value of Fig. 3b.

source = { ref = "doddington2013", doi = "10.1890/12-1270.1", review_ref = 25 }

