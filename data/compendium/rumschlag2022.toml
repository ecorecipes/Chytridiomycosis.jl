provenance = "F"
role = "estimated"
system = { pathogen = "Bd", isolate = "SRS 810", host = "Osteopilus septentrionalis", stage = "tadpole", temperature_C = 21.0, setting = "lab, Trout Creek Conservation Park pond water (unfiltered)" }
location = "Results, para. 2 (p. 176)"
verified = true
notes = "Checked against: published version (J Anim Ecol 91:170-181) and bioRxiv preprint v1; identical. Pond code A in the data deposit. Refit: 13.31 ± 2.22 h."

