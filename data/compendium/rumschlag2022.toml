[[parameter]]
symbol = "persistence"
quantity = "expected time from death of a zoospore to complete decomposition (1/d), common to all four waters"
value = 21.6
units = "h"
uncertainty = { kind = "ci95", lo = 16.4, hi = 26.8, as_printed = "21.6 ± 5.2 hr (±95% CI)" }
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", isolate = "SRS 810", temperature_C = 21.0, setting = "lab, four waters" }
location = "Results, para. 3 (p. 176)"
verified = true
notes = "Checked against: published version (J Anim Ecol 91:170-181) and bioRxiv preprint v1; identical. Persistence = 24 h / d, d in day^-1. Includes abiotic and biotic loss (paper). Refit: 21.56 ± 5.22 h."

[[parameter]]
symbol = "β"
quantity = "per capita transmission rate, common to all four waters, on the paper's (unstated) scale"
value = 7.1e-6
units = "day^-1 ZL0^-1"
uncertainty = { kind = "ci95", lo = 4.5e-6, hi = 9.7e-6, as_printed = "7.1 × 10^-6 ± 2.6 × 10^-6 (95% CI)" }
provenance = "F"
role = "estimated"
system = { pathogen = "Bd", isolate = "SRS 810", host = "Osteopilus septentrionalis", stage = "tadpole", temperature_C = 21.0, setting = "lab, 100 ml containers, one tadpole, 1-day exposure" }
location = "Results, para. 4 (p. 176)"
verified = true
notes = "Checked against: published version (J Anim Ecol 91:170-181) and bioRxiv preprint v1; identical. Units not given in the paper. Reproduced only as β·ZL(0)/1e5, where ZL(0) is the fitted initial live concentration (µl^-1): refit 7.10e-6 ± 2.6e-6. The paper's Fig. 4 needs β·ZL(0) = 0.710 day^-1; with ZL(0) ≈ 143 µl^-1 (Fig. 3a) the printed β is about 1e5 times too small. Pair this value with ZL0 = 1e5 in infection_probability (an inferred convention, not printed)."
