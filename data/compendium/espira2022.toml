# Espira LM, Brouwer AF, Han BA, Foufopoulos J, Eisenberg JNS (2022) Dilution of epidemic
# potential of environmentally transmitted infectious diseases for species with partially
# overlapping habitats. Am Nat 199(2):E43-E56. https://doi.org/10.1086/717413
# Author manuscript: PMC9136953. Online supplement: published version (lab/papers/espira2022/
# espira2022_si.pdf), identical in text to the manuscript supplement (NIHMS1800855).
#
# VERSION CHECKED: every record was read from the PUBLISHED supplement on 2026-11-20.
#
# The paper is analytical and prints no parameter values for its figures. The only numbers are
# the illustrative worked example of the supplement (Table S1, eqs S1-S4), used to explain how
# the force of infection and the loss terms of eq. 1 are built. They are illustrative, not
# estimates for any host or pathogen. Units: acres, days, PU (pathogen units). Note that
# θ1 ε1 = θ2 ε2 = 1 acre, the overlap area, as the definition of θ requires.

source = { ref = "espira2022", doi = "10.1086/717413", review_ref = 28 }

[[parameter]]
symbol = "E1"
quantity = "concentration of pathogens shed by species 1 into its habitat (worked example)"
value = 100
units = "PU acre^-1"
provenance = "A"
role = "state"
system = { setting = "illustrative worked example" }
location = "Online supplement, Table S1"
verified = true
notes = "Checked against: published supplement Table S1."

