# Drawert B, Griesemer M, Petzold LR, Briggs CJ (2017) Using stochastic epidemiological models
# to evaluate conservation strategies for endangered amphibians. J R Soc Interface 14:20170480.
# https://doi.org/10.1098/rsif.2017.0480
# Checked against the published PDF (lab/papers/drawert2017.pdf) and the electronic
# supplementary material (ESM): the SI text (figshare 10.6084/m9.figshare.5328160) and the
# simulation code and parameter data (figshare 10.6084/m9.figshare.5328127), both CC BY 4.0,
# in lab/papers/drawert2017_si/. "§" without a prefix is the main text; "ESM §" the SI text.
# Time unit: days. Loads are sporangia per frog; zoospores are counts in a pool of volume V.
#
# The paper samples its parameters, so the base set holds the fixed constants, the sampling
# ranges (Table 1), the sampling rules (ESM §1.4) and the design of the intervention study
# (§3.3). The 2132 sampled points themselves are the authors' table, bundled as
# data/drawert2017/baseline_points.csv. Named sets "groupA" … "groupE" are the representative
# points of Fig. 3c (ESM Table S9, rounded as printed; IDs 120, 1094, 182, 982, 192 of the
# table).

source = { ref = "drawert2017", doi = "10.1098/rsif.2017.0480", review_ref = 39 }

# --- fixed constants -------------------------------------------------------------------------

[[parameter]]
symbol = "Smax"
quantity = "lethal sporangial load: a frog dies when its load exceeds Smax"
value = 10000
units = "sporangia host^-1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", host = "Rana muscosa/R. sierrae" }
location = "Table 1; §3 (frog i dies for S_i > Smax)"
verified = true
notes = "Code (WithinHostModel.c, FrogFunctions.c): a frog dies when an infection would take its load to Smax + 1. ESM Table S3 prints [S_i] ≥ Smax."

[[parameter]]
symbol = "S0"
quantity = "initial load on the single infected frog"
value = 100
units = "sporangia host^-1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd", host = "Rana muscosa/R. sierrae" }
location = "§3.4 (S_1(0) = 100); code README (-param_initSporangia 100); data column param_initSporangia"
verified = true

[[parameter]]
symbol = "Z0"
quantity = "initial zoospores in the pool"
value = 0
units = "zoospores"
provenance = "A"
role = "structural"
system = { pathogen = "Bd" }
location = "§3.4 (Z(0) = 0)"
verified = true

[[parameter]]
symbol = "V"
quantity = "volume of the zoospore pool"
value = 1.0
units = "1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd" }
location = "ESM §1.3 (volume set to unity); code WithinHostModel.c param_V 1.0"
verified = true

[[parameter]]
symbol = "tfinal"
quantity = "simulation horizon; frogs and fungus both present then = persistence"
value = 1000
units = "day"
provenance = "A"
role = "structural"
system = { pathogen = "Bd" }
location = "ESM §1.2, §1.3 (1000 days); code tfinal = 1000"
verified = true

[[parameter]]
symbol = "n_runs"
quantity = "stochastic realisations per parameter point"
value = 30
units = "1"
provenance = "A"
role = "structural"
system = { pathogen = "Bd" }
location = "§3.4; ESM §1.3, §1.5; data column param_ensemble_size"
verified = true

