# Turner A, Heard G, Mathwin R, Bradshaw CJA, Hall A, Wassens S (2025) Cool-season
# environmental water delivery increases extinction risk for chytrid-infected amphibians.
# Conserv Sci Pract 7(5):e70022. https://doi.org/10.1111/csp2.70022
# Code and data: Zenodo doi:10.5281/zenodo.10921748 (TurnerBdModel.zip, CC BY 4.0),
# retrieved 2026-11-19 into lab/papers/turner2025/zenodo/.
#
# VERSION CHECKED: NOT the paper. The full text (Wiley and the CSU repository, both behind a
# bot check) could not be retrieved; only the Crossref abstract was read (it gives the three
# extinction probabilities used as validation targets and the 10/15/20 °C inflow
# temperatures). Every value below was read from the authors' R code,
# customFunctions/PVA_functionsV2.R (function pop.func), so every record has
# verified = false.
#
# Species: Litoria raniformis (southern bell frog), a semi-permanent wetland ("NapNap") in
# the regulated floodplain of south-western NSW. Female-only, age-classified (0-1, 1-2, ...,
# 5+ yr; row 1 holds EGGS), annual time step, 52 years. Bd enters through the annual adult
# survival and the summer survival of metamorphs, which the authors precomputed per watering
# month from Bd load-survival relationships (the arrays referenceData/*WateringArray_*.csv);
# the code that generated those arrays is NOT in the archive. The year-by-year means and SDs
# that the coded model actually uses are bundled in data/turner2025/survival_series.csv.
#
# Density dependence: the authors fit nls curves to hand-set anchor points in the code. The
# fitted coefficients below (provenance D) were obtained by running exactly those nls calls
# in R 4.x (port algorithm, same start values) on 2026-11-19; the anchor points are in the
# notes.

source = { ref = "turner2025", doi = "10.1111/csp2.70022", review_ref = 41 }

