# Base set: Table 1 "estimated value", read from the PDF page images on 2026-11-09.
# Named sets fig2b, fig2c, fig2d: the three parameter points of Fig. 2 (legend).
# Host: Bufo bufo at one pond. Time unit: years, except t1, t2 and ω, which are in days.

