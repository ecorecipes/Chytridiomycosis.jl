project:
  type: default
  render:
    - "*/*.qmd"

# quarto does not reliably apply a project-wide engine (quarto-cli#3157), so every .qmd
# also sets `engine: julia` in its own front matter.
engine: julia

julia:
  project: "."

format:
  html:
    theme: cosmo
    toc: true
    embed-resources: true
  gfm:
    toc: true

execute:
  freeze: auto
